<script>
  // ==========================================================================
  // MODUL PENGELOLAAN DATA GAJI KARYAWAN (OPSI A: 1 NAMA PER BARIS & INPUT HARIAN)
  // File: Scripts_DataGaji.html
  // Tabel utama menampilkan 1 baris per karyawan dengan total akumulasi berjalan.
  // Dilengkapi tombol [+ Input Harian] cepat dan [👁️ Rincian] log harian.
  // Mendukung Pengelolaan Periode Payroll Dinamis (Cut-Off Kustom & Tutup Buku).
  // ==========================================================================

  (function () {
    var cachedDataGajiLogs = [];
    var cachedDataGajiEmployees = [];
    var cachedPeriodeList = [];
    var currentSelectedPeriodId = '';
    var currentActivePeriodInfo = null;
    var isCurrentPeriodClosed = false;
    var currentPageDataGaji = 1;
    var pageSizeDataGaji = 15;
    var bsModalDataGaji = null;
    var bsModalRincianGaji = null;
    var bsModalBukaPeriode = null;
    var currentRincianEmpId = null;
    var currentPageRincianLog = 1;
    var pageSizeRincianLog = 10;

    var NAMA_HARI_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function safeFormatDateDMY(dateVal) {
      if (!dateVal || dateVal === '-') return '-';
      if (typeof formatDateDMY === 'function') return formatDateDMY(dateVal);
      try {
        var d = (dateVal instanceof Date) ? dateVal : new Date(dateVal);
        if (isNaN(d.getTime())) return String(dateVal);
        var dd = String(d.getDate()).padStart(2, '0');
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        var yyyy = d.getFullYear();
        return dd + '/' + mm + '/' + yyyy;
      } catch (e) {
        return String(dateVal);
      }
    }

    function formatDateWithDay(dateVal) {
      if (!dateVal || dateVal === '-') return '-';
      var dObj = null;
      if (dateVal instanceof Date) {
        dObj = dateVal;
      } else {
        var s = String(dateVal).trim().split('T')[0].split(' ')[0];
        if (s.indexOf('-') !== -1) {
          var p = s.split('-');
          if (p.length === 3) {
            if (p[0].length === 4) {
              dObj = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
            } else {
              dObj = new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
            }
          }
        } else if (s.indexOf('/') !== -1) {
          var p = s.split('/');
          if (p.length === 3) {
            if (p[0].length === 4) {
              dObj = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
            } else {
              dObj = new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
            }
          }
        }
      }
      if (!dObj || isNaN(dObj.getTime())) {
        return safeFormatDateDMY(dateVal);
      }
      var dayName = NAMA_HARI_ID[dObj.getDay()];
      var dd = String(dObj.getDate()).padStart(2, '0');
      var mm = String(dObj.getMonth() + 1).padStart(2, '0');
      var yyyy = dObj.getFullYear();
      return dayName + ', ' + dd + '/' + mm + '/' + yyyy;
    }
    window.formatDateWithDay = formatDateWithDay;

    // Inisialisasi awal saat halaman dibuka
    window.initDataGajiPage = function () {
      populateDataGajiDeptFilters();
      loadDataGajiList();
    };

    function populateDataGajiDeptFilters() {
      var selFilter = document.getElementById('filterDataGajiDept');
      if (!selFilter) return;
      var currentVal = selFilter.value || 'SEMUA';
      selFilter.innerHTML = '<option value="SEMUA">-- Semua Departemen --</option>';

      var depts = [];
      if (Array.isArray(dbDepartemen)) {
        dbDepartemen.forEach(function (d) {
          if (d.name && !depts.includes(d.name)) depts.push(d.name);
        });
      }
      if (Array.isArray(dbKaryawan)) {
        dbKaryawan.forEach(function (k) {
          if (k.dept && !depts.includes(k.dept)) depts.push(k.dept);
        });
      }
      depts.sort();

      depts.forEach(function (d) {
        selFilter.innerHTML += '<option value="' + escapeHTML(d) + '">' + escapeHTML(d) + '</option>';
      });

      selFilter.value = depts.includes(currentVal) ? currentVal : 'SEMUA';
    }

    window.resetDataGajiFilter = function () {
      var selDept = document.getElementById('filterDataGajiDept');
      if (selDept) selDept.value = 'SEMUA';
      var searchEl = document.getElementById('searchDataGaji');
      if (searchEl) searchEl.value = '';
      currentPageDataGaji = 1;
      renderDataGajiTable();
    };

    // --- POPULATE PERIODE SELECTS & CONTROLLERS ---
    function populatePeriodeDropdowns(periods, activePeriod) {
      if (Array.isArray(periods)) {
        cachedPeriodeList = periods;
      }
      if (activePeriod) {
        currentActivePeriodInfo = activePeriod;
      }

      if (!currentSelectedPeriodId) {
        if (currentActivePeriodInfo && currentActivePeriodInfo.id) {
          currentSelectedPeriodId = currentActivePeriodInfo.id;
        } else if (cachedPeriodeList.length > 0) {
          currentSelectedPeriodId = cachedPeriodeList[0].id;
        }
      }

      var selHrd = document.getElementById('selectDataGajiPeriode');
      var selKaryawan = document.getElementById('selectGajiSayaPeriode');

      [selHrd, selKaryawan].forEach(function (sel) {
        if (!sel) return;
        var curVal = sel.value || currentSelectedPeriodId;
        sel.innerHTML = '';
        if (cachedPeriodeList.length === 0) {
          sel.innerHTML = '<option value="">-- Belum Ada Periode --</option>';
          return;
        }
        cachedPeriodeList.forEach(function (p) {
          var opt = document.createElement('option');
          opt.value = p.id;
          var pTitle = p.name || p.nama || p.id;
          var stText = (p.status === 'TERBUKA') ? 'Aktif' : 'Ditutup';
          opt.text = pTitle + ' (' + stText + ')';
          sel.appendChild(opt);
        });
        if (curVal && cachedPeriodeList.some(function (p) { return p.id === curVal; })) {
          sel.value = curVal;
        } else if (currentSelectedPeriodId) {
          sel.value = currentSelectedPeriodId;
        }
      });

      var targetPeriod = cachedPeriodeList.find(function (p) { return p.id === currentSelectedPeriodId; }) || currentActivePeriodInfo;
      isCurrentPeriodClosed = (targetPeriod && targetPeriod.status === 'DITUTUP');

      // HRD Status & Cut-Off
      var badgeHrd = document.getElementById('badgeDataGajiStatusPeriode');
      var cutOffHrd = document.getElementById('textDataGajiCutOffRange');
      var btnTutup = document.getElementById('btnTutupBukuPayroll');

      if (badgeHrd) {
        if (isCurrentPeriodClosed) {
          badgeHrd.className = 'badge bg-danger-subtle text-danger border border-danger-subtle extra-small fw-semibold';
          badgeHrd.innerHTML = '<i class="bi bi-lock-fill me-1"></i>BUKU DITUTUP';
        } else {
          badgeHrd.className = 'badge bg-success-subtle text-success border border-success-subtle extra-small fw-semibold';
          badgeHrd.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>BUKU TERBUKA';
        }
      }
      if (cutOffHrd && targetPeriod) {
        var sDate = targetPeriod.startDate ? safeFormatDateDMY(targetPeriod.startDate) : '-';
        var eDate = targetPeriod.endDate ? safeFormatDateDMY(targetPeriod.endDate) : '-';
        cutOffHrd.innerText = sDate + ' s/d ' + eDate;
      }
      var btnHapus = document.getElementById('btnHapusPeriodePayroll');
      if (btnTutup) {
        btnTutup.style.display = isCurrentPeriodClosed ? 'none' : 'inline-flex';
      }
      if (btnHapus) {
        btnHapus.style.display = isCurrentPeriodClosed ? 'inline-flex' : 'none';
      }

      // Karyawan Status & Cut-Off
      var badgeKaryawan = document.getElementById('badgeGajiSayaStatusPeriode');
      var cutOffKaryawan = document.getElementById('textGajiSayaCutOffRange');
      if (badgeKaryawan) {
        if (isCurrentPeriodClosed) {
          badgeKaryawan.className = 'badge bg-danger-subtle text-danger border border-danger-subtle extra-small fw-semibold';
          badgeKaryawan.innerHTML = '<i class="bi bi-lock-fill me-1"></i>BUKU DITUTUP';
        } else {
          badgeKaryawan.className = 'badge bg-success-subtle text-success border border-success-subtle extra-small fw-semibold';
          badgeKaryawan.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>BUKU TERBUKA';
        }
      }
      if (cutOffKaryawan && targetPeriod) {
        var sDate = targetPeriod.startDate ? safeFormatDateDMY(targetPeriod.startDate) : '-';
        var eDate = targetPeriod.endDate ? safeFormatDateDMY(targetPeriod.endDate) : '-';
        cutOffKaryawan.innerText = sDate + ' s/d ' + eDate;
      }
    }
    window.populatePeriodeDropdowns = populatePeriodeDropdowns;

    // On Change Period Handlers
    window.onDataGajiPeriodeChange = function () {
      var sel = document.getElementById('selectDataGajiPeriode');
      if (sel && sel.value) {
        currentSelectedPeriodId = sel.value;
        loadDataGajiList();
      }
    };

    window.onGajiSayaPeriodeChange = function () {
      var sel = document.getElementById('selectGajiSayaPeriode');
      if (sel && sel.value) {
        currentSelectedPeriodId = sel.value;
        initGajiSayaPage();
      }
    };

    // --- LOAD DATA GAJI LIST ---
    window.loadDataGajiList = function () {
      var tbody = document.getElementById('tableBodyDataGaji');
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data gaji karyawan...</td></tr>';
      }

      // Pastikan dbKaryawan dan dbDepartemen terisi jika belum ada
      if (!Array.isArray(dbKaryawan) || dbKaryawan.length === 0) {
        gasRun('getInitialData', Auth.getToken()).then(function (initRes) {
          if (initRes && initRes.success) {
            if (Array.isArray(initRes.karyawan)) dbKaryawan = initRes.karyawan;
            if (Array.isArray(initRes.departemen)) dbDepartemen = initRes.departemen;
            populateDataGajiDeptFilters();
          }
        }).catch(function (e) { console.warn('Fetch initial data error:', e); });
      }

      gasRun('getDataGaji', Auth.getToken(), null, null, currentSelectedPeriodId).then(function (res) {
        if (handleSessionExpired(res)) return;

        if (res && res.success) {
          cachedDataGajiLogs = Array.isArray(res.list) ? res.list : [];
          cachedDataGajiEmployees = Array.isArray(res.employees) ? res.employees : [];
          if (Array.isArray(res.periods)) cachedPeriodeList = res.periods;
          if (res.period) {
            currentActivePeriodInfo = res.period;
            if (!currentSelectedPeriodId) currentSelectedPeriodId = res.period.id;
          }
          populatePeriodeDropdowns(res.periods, res.period);
          renderDataGajiTable();

          // Jika modal rincian sedang terbuka, segarkan tampilannya juga
          if (currentRincianEmpId && bsModalRincianGaji) {
            renderRincianModal(currentRincianEmpId);
          }
        } else {
          if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="text-center text-danger py-4">' + escapeHTML(res.message || 'Gagal memuat data gaji.') + '</td></tr>';
        }
      }).catch(function (err) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="text-center text-danger py-4">Gagal memuat data: ' + escapeHTML(err.toString()) + '</td></tr>';
      });
    };

    function matchLogToEmp(log, emp) {
      if (!log || !emp) return false;
      var logId = String(log.empId || '').trim().toLowerCase();
      var empId = String(emp.id || '').trim().toLowerCase();
      if (logId && empId && logId === empId) return true;

      // Nomor digit saja (misal BBB-260620 dengan 260620)
      var numLog = logId.replace(/\D/g, '');
      var numEmp = empId.replace(/\D/g, '');
      if (numLog && numEmp && numLog === numEmp) return true;

      // Nama karyawan
      var logName = String(log.empName || '').trim().toLowerCase();
      var empName = String(emp.name || '').trim().toLowerCase();
      if (logName && empName && logName === empName) return true;

      return false;
    }

    // --- RENDER TABEL UTAMA (1 BARIS PER KARYAWAN) ---
    window.renderDataGajiTable = function () {
      var tbody = document.getElementById('tableBodyDataGaji');
      if (!tbody) return;
      tbody.innerHTML = '';

      var selDept = document.getElementById('filterDataGajiDept');
      var filterDept = selDept ? selDept.value : 'SEMUA';

      var search = (document.getElementById('searchDataGaji') ? document.getElementById('searchDataGaji').value : '').toLowerCase().trim();

      // 1. Petakan setiap karyawan di dbKaryawan dan hitung akumulasi log hariannya
      var matchedLogIds = new Set();
      var empList = (Array.isArray(dbKaryawan) ? dbKaryawan : []).map(function (k) {
        var kLogs = cachedDataGajiLogs.filter(function (log) {
          var match = matchLogToEmp(log, k);
          if (match && log.id) matchedLogIds.add(log.id);
          return match;
        });

        var totalJamOt = 0;
        var totalNominalOt = 0;
        var totalJamSPL = 0;
        var totalNominalSPL = 0;
        var totalRitase = 0;
        var totalNominalRit = 0;
        var totalTunjangan = 0;

        kLogs.forEach(function (log) {
          totalJamOt += Number(log.jamOvertime || 0);
          totalNominalOt += Number(log.totalOvertime || 0);
          totalJamSPL += Number(log.jamSPL || 0);
          totalNominalSPL += Number(log.totalSPL || 0);
          totalRitase += Number(log.ritase || 0);
          totalNominalRit += Number(log.totalRitase || 0);
          totalTunjangan += Number(log.tunjanganHarian || 0);
        });

        var basic = Number(k.gajiPokok || 0);
        var empSummary = (cachedDataGajiEmployees || []).find(function (s) {
          return matchLogToEmp({ empId: s.id, empName: s.name }, k);
        });

        var isBpjsKesOff = (k.bpjsKesSetting === 'Tidak Ikut' || k.bpjsKesSetting === 'Non Aktif');
        var isBpjsTKOff = (k.bpjsTKSetting === 'Tidak Ikut' || k.bpjsTKSetting === 'Non Aktif');

        var potKes = isBpjsKesOff ? 0 : (empSummary ? (Number(empSummary.potonganBPJSKes) || 0) : (Number(k.bpjsKesNominal) || 0));
        var potTk = isBpjsTKOff ? 0 : (empSummary ? (Number(empSummary.potonganBPJSTK) || 0) : (Number(k.bpjsTKNominal) || 0));
        var potPph = (empSummary && empSummary.potonganPPh21 !== undefined) ? (Number(empSummary.potonganPPh21) || 0) : (Number(k.pph21Nominal) || 0);
        var potKasbon = empSummary ? (Number(empSummary.potonganKasbon) || 0) : 0;
        var catKasbon = empSummary ? (empSummary.catatanKasbon || '') : '';
        var potLain = empSummary ? (Number(empSummary.potonganLain) || 0) : 0;
        var catPotLain = empSummary ? (empSummary.catatanPotonganLain || '') : '';
        var detailPot = (empSummary && empSummary.detailPotongan) ? empSummary.detailPotongan : {
          bpjsKesSetting: k.bpjsKesSetting || 'Tidak Ikut',
          bpjsTKSetting: k.bpjsTKSetting || 'Tidak Ikut'
        };
        if (isBpjsKesOff) {
          detailPot.bpjsKesSetting = 'Tidak Ikut';
          detailPot.bpjsKesNominal = 0;
        }
        if (isBpjsTKOff) {
          detailPot.bpjsTKSetting = 'Tidak Ikut';
          detailPot.bpjsTKNominal = 0;
        }

        var pkwtNom = empSummary ? (Number(empSummary.kompensasiPKWT) || 0) : ((detailPot && Number(detailPot.kompensasiPKWT)) || 0);
        var pkwtTgl = empSummary ? (empSummary.tanggalKompensasiPKWT || '') : ((detailPot && detailPot.tanggalKompensasiPKWT) || '');
        var pkwtCat = empSummary ? (empSummary.keteranganPKWT || '') : ((detailPot && detailPot.keteranganPKWT) || '');

        var totalKlaim = empSummary ? (Number(empSummary.totalKlaim) || 0) : ((detailPot && Number(detailPot.totalKlaim)) || 0);
        var klaimTravel = empSummary ? (Number(empSummary.klaimTravel) || 0) : ((detailPot && Number(detailPot.klaimTravel)) || 0);
        var klaimMCU = empSummary ? (Number(empSummary.klaimMCU) || 0) : ((detailPot && Number(detailPot.klaimMCU)) || 0);
        var klaimLainnya = empSummary ? (Number(empSummary.klaimLainnya) || 0) : ((detailPot && Number(detailPot.klaimLainnya)) || 0);
        var listKlaim = (empSummary && Array.isArray(empSummary.listKlaim) && empSummary.listKlaim.length > 0)
          ? empSummary.listKlaim
          : ((detailPot && Array.isArray(detailPot.listKlaim)) ? detailPot.listKlaim : []);

        var totalPotonganPokok = potKes + potTk + potPph;
        var gajiPokokBersih = Math.max(0, basic - totalPotonganPokok);
        var totalTambahan = totalNominalOt + totalNominalSPL + totalNominalRit + totalTunjangan;
        var grandTotalBruto = basic + totalTambahan + pkwtNom + totalKlaim;
        var gajiSebelumKasbon = gajiPokokBersih + totalTambahan + pkwtNom + totalKlaim;
        var totalPotongan = totalPotonganPokok + potKasbon + potLain;
        var takeHomePay = Math.max(0, grandTotalBruto - totalPotongan);

        return {
          id: k.id,
          name: k.name,
          dept: k.dept || '-',
          jabatan: k.jabatan || '-',
          basic: basic,
          daysCount: kLogs.length,
          totalJamOt: totalJamOt,
          totalNominalOt: totalNominalOt,
          totalJamSPL: totalJamSPL,
          totalNominalSPL: totalNominalSPL,
          totalRitase: totalRitase,
          totalNominalRit: totalNominalRit,
          totalTunjangan: totalTunjangan,
          grandTotal: grandTotalBruto,
          potonganBPJSKes: potKes,
          potonganBPJSTK: potTk,
          potonganPPh21: potPph,
          potonganKasbon: potKasbon,
          catatanKasbon: catKasbon,
          potonganLain: potLain,
          catatanPotonganLain: catPotLain,
          totalPotonganPokok: totalPotonganPokok,
          gajiPokokBersih: gajiPokokBersih,
          gajiSebelumKasbon: gajiSebelumKasbon,
          totalPotongan: totalPotongan,
          takeHomePay: takeHomePay,
          detailPotongan: detailPot,
          kompensasiPKWT: pkwtNom,
          tanggalKompensasiPKWT: pkwtTgl,
          keteranganPKWT: pkwtCat,
          totalKlaim: totalKlaim,
          klaimTravel: klaimTravel,
          klaimMCU: klaimMCU,
          klaimLainnya: klaimLainnya,
          listKlaim: listKlaim,
          logs: kLogs
        };
      });

      // 2. Jika ada log di database yang tidak terhubung ke karyawan di dbKaryawan, buatkan barisnya otomatis!
      var unmappedLogs = cachedDataGajiLogs.filter(function (l) { return l.id && !matchedLogIds.has(l.id); });
      var groupedUnmapped = {};
      unmappedLogs.forEach(function (log) {
        var key = String(log.empId || log.empName || 'UNKNOWN').trim().toLowerCase();
        if (!groupedUnmapped[key]) {
          groupedUnmapped[key] = {
            id: log.empId || key,
            name: log.empName || log.empId || 'Karyawan',
            dept: log.dept || '-',
            jabatan: log.jabatan || '-',
            basic: Number(log.basic || 0),
            logs: []
          };
        }
        groupedUnmapped[key].logs.push(log);
      });

      Object.keys(groupedUnmapped).forEach(function (kKey) {
        var g = groupedUnmapped[kKey];
        var totalJamOt = 0, totalNominalOt = 0;
        var totalJamSPL = 0, totalNominalSPL = 0;
        var totalRitase = 0, totalNominalRit = 0;
        var totalTunjangan = 0;
        g.logs.forEach(function (log) {
          totalJamOt += Number(log.jamOvertime || 0);
          totalNominalOt += Number(log.totalOvertime || 0);
          totalJamSPL += Number(log.jamSPL || 0);
          totalNominalSPL += Number(log.totalSPL || 0);
          totalRitase += Number(log.ritase || 0);
          totalNominalRit += Number(log.totalRitase || 0);
          totalTunjangan += Number(log.tunjanganHarian || 0);
        });
        var basic = Number(g.basic || 0);
        var gBruto = basic + totalNominalOt + totalNominalSPL + totalNominalRit + totalTunjangan;
        empList.push({
          id: g.id,
          name: g.name,
          dept: g.dept,
          jabatan: g.jabatan,
          basic: basic,
          daysCount: g.logs.length,
          totalJamOt: totalJamOt,
          totalNominalOt: totalNominalOt,
          totalJamSPL: totalJamSPL,
          totalNominalSPL: totalNominalSPL,
          totalRitase: totalRitase,
          totalNominalRit: totalNominalRit,
          totalTunjangan: totalTunjangan,
          grandTotal: gBruto,
          potonganBPJSKes: 0,
          potonganBPJSTK: 0,
          potonganPPh21: 0,
          potonganKasbon: 0,
          catatanKasbon: '',
          potonganLain: 0,
          catatanPotonganLain: '',
          totalPotonganPokok: 0,
          gajiPokokBersih: basic,
          gajiSebelumKasbon: gBruto,
          totalPotongan: 0,
          takeHomePay: gBruto,
          detailPotongan: {},
          logs: g.logs
        });
      });

      // 3. Urutkan: Karyawan yang memiliki data entri harian (daysCount > 0) tampil paling atas!
      empList.sort(function (a, b) {
        if (b.daysCount !== a.daysCount) {
          return b.daysCount - a.daysCount;
        }
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      // Terapkan Filter Departemen & Pencarian
      var filtered = empList.filter(function (emp) {
        if (filterDept && filterDept !== 'SEMUA') {
          if (String(emp.dept || '').toLowerCase() !== filterDept.toLowerCase()) return false;
        }
        if (search) {
          var match = emp.name.toLowerCase().includes(search) ||
            emp.id.toLowerCase().includes(search) ||
            emp.dept.toLowerCase().includes(search) ||
            emp.jabatan.toLowerCase().includes(search);
          if (!match) return false;
        }
        return true;
      });

      var badgeCount = document.getElementById('badgeCountDataGaji');
      if (badgeCount) badgeCount.innerText = filtered.length + ' Karyawan';

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">Tidak ada data karyawan yang sesuai filter.</td></tr>';
        renderPaginationControls('paginationDataGaji', 0, 1, function () { });
        return;
      }

      var startIdx = (currentPageDataGaji - 1) * pageSizeDataGaji;
      var pageData = filtered.slice(startIdx, startIdx + pageSizeDataGaji);

      pageData.forEach(function (emp, idx) {
        var no = startIdx + idx + 1;

        var otText = emp.totalJamOt > 0 || emp.totalNominalOt > 0
          ? '<div class="text-end"><span class="fw-semibold text-primary">' + formatRupiahVal(emp.totalNominalOt) + '</span><br><small class="text-muted extra-small">' + emp.totalJamOt + ' Jam</small></div>'
          : '<span class="text-muted extra-small">-</span>';

        var splText = emp.totalJamSPL > 0 || emp.totalNominalSPL > 0
          ? '<div class="text-end"><span class="fw-semibold text-success">' + formatRupiahVal(emp.totalNominalSPL) + '</span><br><small class="text-muted extra-small">' + emp.totalJamSPL + ' Jam</small></div>'
          : '<span class="text-muted extra-small">-</span>';

        var ritText = emp.totalRitase > 0 || emp.totalNominalRit > 0
          ? '<div class="text-end"><span class="fw-semibold text-warning">' + formatRupiahVal(emp.totalNominalRit) + '</span><br><small class="text-muted extra-small">' + emp.totalRitase + ' Rit</small></div>'
          : '<span class="text-muted extra-small">-</span>';

        var tunjText = emp.totalTunjangan > 0

        document.getElementById('gajiTarifSPL').value = item.tarifSPL ? formatRupiahVal(item.tarifSPL).replace('Rp ', '') : '';
        document.getElementById('gajiRitase').value = item.ritase || '';

        document.getElementById('gajiTunjanganHarian').value = item.tunjanganHarian ? formatRupiahVal(item.tunjanganHarian).replace('Rp ', '') : '';

    function populateModalDeptSelect(selectedDept) {
      var sel = document.getElementById('gajiDeptSelect');
      if (!sel) return;
      sel.innerHTML = '<option value="">-- Pilih Departemen --</option>';

      var depts = [];
      if (Array.isArray(dbDepartemen)) {
        dbDepartemen.forEach(function (d) {
          if (d.name && !depts.includes(d.name)) depts.push(d.name);
        });
      }
      if (Array.isArray(dbKaryawan)) {
        dbKaryawan.forEach(function (k) {
          if (k.dept && !depts.includes(k.dept)) depts.push(k.dept);
        });
      }
      depts.sort();

      depts.forEach(function (d) {
        sel.innerHTML += '<option value="' + escapeHTML(d) + '">' + escapeHTML(d) + '</option>';
      });

      if (selectedDept) sel.value = selectedDept;
    }

    function populateModalEmpSelect(deptName, selectedEmpId) {
      var sel = document.getElementById('gajiEmpSelect');
      if (!sel) return;
      if (!deptName) {
        sel.innerHTML = '<option value="">-- Pilih Departemen Terlebih Dahulu --</option>';
        sel.disabled = true;
        return;
      }

      var filtered = (dbKaryawan || []).filter(function (k) {
        return String(k.dept || '').trim().toLowerCase() === String(deptName).trim().toLowerCase();
      });

      if (filtered.length === 0) {
        sel.innerHTML = '<option value="">-- Tidak ada karyawan di departemen ini --</option>';
        sel.disabled = true;
        return;
      }

      sel.disabled = false;
      sel.innerHTML = '<option value="">-- Pilih Karyawan (' + filtered.length + ' Orang) --</option>';

      filtered.forEach(function (k) {
        var isSel = selectedEmpId && String(k.id).toLowerCase() === String(selectedEmpId).toLowerCase();
        sel.innerHTML += '<option value="' + escapeHTML(k.id) + '"' + (isSel ? ' selected' : '') + '>' + escapeHTML(k.name) + ' (' + escapeHTML(k.id) + ')</option>';
      });

      if (selectedEmpId) sel.value = selectedEmpId;
    }

    // Cek database SPL yang berstatus 'Disetujui' dan isi otomatis ke form
    window.checkApprovedSPLForSelectedDate = function (forceManual) {
      var tglInput = document.getElementById('gajiTanggal');
      var empIdHidden = document.getElementById('gajiEmpIdHidden');
      var empSelect = document.getElementById('gajiEmpSelect');
      var empNameHidden = document.getElementById('gajiEmpNameHidden');

      var tanggal = tglInput ? tglInput.value.trim() : '';
      var empId = (empIdHidden && empIdHidden.value.trim()) || (empSelect && empSelect.value.trim()) || '';
      var empName = (empNameHidden && empNameHidden.value.trim()) || '';

      // Jika empName kosong, cari dari dropdown opsi karyawan yang sedang dipilih
      if (!empName && empSelect && empSelect.selectedIndex >= 0) {
        var optText = empSelect.options[empSelect.selectedIndex].text || '';
        var cleanOpt = optText.split('(')[0].trim();
        if (cleanOpt && !cleanOpt.startsWith('--')) empName = cleanOpt;
      }

      var banner = document.getElementById('splAutoDetectBanner');
      var bannerText = document.getElementById('splAutoDetectText');
      var autoTag = document.getElementById('splAutoTag');
      var loadingEl = document.getElementById('splLoadingIndicator');
      var jamSPLInput = document.getElementById('gajiJamSPL');
      var splIdHidden = document.getElementById('gajiSplIdHidden');

      if (!tanggal || !empId) {
        if (banner) banner.classList.add('d-none');
        if (autoTag) autoTag.classList.add('d-none');
        if (loadingEl) loadingEl.classList.add('d-none');
        if (splIdHidden) splIdHidden.value = '';
        if (forceManual) {
          Swal.fire('Perhatian', 'Pilih Tanggal Kerja dan Karyawan terlebih dahulu.', 'info');
        }
        return;
      }

      if (loadingEl) loadingEl.classList.remove('d-none');
      if (banner) banner.classList.add('d-none');

      gasRun('getApprovedSPLForSalaryInput', Auth.getToken(), empId, tanggal, empName).then(function (res) {
        if (loadingEl) loadingEl.classList.add('d-none');
        if (handleSessionExpired(res)) return;

        if (!res || !res.success) {
          if (autoTag) autoTag.classList.add('d-none');
          if (banner) banner.classList.add('d-none');
          if (splIdHidden) splIdHidden.value = '';
          if (forceManual) {
            Swal.fire('Pemberitahuan', (res && res.message) || 'Gagal memeriksa database SPL.', 'warning');
          }
          return;
        }

        if (res.hasSPL && res.totalJam > 0) {
          // HANYA MENGISI JAM SPL, TIDAK MENGGANGGU OVERTIME
          if (jamSPLInput) jamSPLInput.value = res.totalJam;
          if (splIdHidden) splIdHidden.value = (res.splIds || []).join(', ');
          if (autoTag) autoTag.classList.remove('d-none');

          if (banner && bannerText) {
            var detailsText = (res.splIds || []).join(', ');
            if (res.shifts) detailsText += ' • ' + res.shifts;
            bannerText.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Terisi otomatis ke SPL: <strong>' + res.totalJam + ' Jam</strong> dari SPL Disetujui (' + escapeHTML(detailsText) + ')';
            banner.classList.remove('d-none');
          }

          // Jika catatan masih kosong, bantu beri rincian nomor SPL
          var catInput = document.getElementById('gajiCatatan');
          if (catInput && !catInput.value.trim()) {
            var uraianStr = '';
            if (res.details && res.details.length > 0 && res.details[0].uraian && res.details[0].uraian !== '-') {
              uraianStr = ' - ' + res.details[0].uraian;
            }
            catInput.value = 'SPL: ' + (res.splIds || []).join(', ') + uraianStr;
          }

          calculateTotalGajiLive();

          if (forceManual) {
            Swal.fire({
              icon: 'success',
              title: 'SPL Disetujui Terdeteksi',
              html: 'Ditemukan data SPL resmi <strong>' + res.totalJam + ' Jam</strong> (' + escapeHTML((res.splIds || []).join(', ')) + '). Jam SPL otomatis terisi ke form SPL.',
              timer: 2500,
              showConfirmButton: false
            });
          }
        } else {
          if (autoTag) autoTag.classList.add('d-none');
          if (banner) banner.classList.add('d-none');
          if (splIdHidden) splIdHidden.value = '';

          if (forceManual) {
            var displayName = empName || empId;
            Swal.fire({
              icon: 'info',
              title: 'Tidak Ada SPL Disetujui',
              text: 'Tidak ada data SPL dengan status "Disetujui" untuk karyawan ' + displayName + ' pada tanggal ' + (safeFormatDateDMY(tanggal) || tanggal) + '.',
              confirmButtonColor: '#2563eb'
            });
          }
        }
      }).catch(function (err) {
        if (loadingEl) loadingEl.classList.add('d-none');
        console.warn('Gagal cek SPL:', err);
        if (forceManual) {
          Swal.fire('Error', 'Gagal memproses pengecekan SPL: ' + (err.message || err), 'error');
        }
      });
    };

    // --- LIVE CALCULATION IN MODAL (OVERTIME & SPL TERPISAH) ---
    window.calculateTotalGajiLive = function () {
      var basic = Number(document.getElementById('gajiBasicNumeric').value) || 0;

      // Overtime (Lembur biasa)
      var jamOt = parseFloat(document.getElementById('gajiJamOvertime').value) || 0;
      var tarifOt = parseRupiahVal(document.getElementById('gajiTarifOvertime').value);
      var subtotalOt = Math.round(jamOt * tarifOt);

      // SPL (Surat Perintah Lembur)
      var jamSPL = parseFloat(document.getElementById('gajiJamSPL').value) || 0;
      var tarifSPL = parseRupiahVal(document.getElementById('gajiTarifSPL').value);
      var subtotalSPL = Math.round(jamSPL * tarifSPL);

      // Ritase
      var ritase = parseFloat(document.getElementById('gajiRitase').value) || 0;
      var tarifRit = parseRupiahVal(document.getElementById('gajiTarifRitase').value);
      var subtotalRit = Math.round(ritase * tarifRit);

      // Tunjangan
      var tunjangan = parseRupiahVal(document.getElementById('gajiTunjanganHarian').value);

      // Grand Total Live = Basic + Overtime + SPL + Ritase + Tunjangan
      var grandTotalGaji = basic + subtotalOt + subtotalSPL + subtotalRit + tunjangan;

      var pillOt = document.getElementById('previewSubtotalOvertime');
      if (pillOt) pillOt.innerText = formatRupiahVal(subtotalOt);

      var pillSPL = document.getElementById('previewSubtotalSPL');
      if (pillSPL) pillSPL.innerText = formatRupiahVal(subtotalSPL);

      var pillRit = document.getElementById('previewSubtotalRitase');
      if (pillRit) pillRit.innerText = formatRupiahVal(subtotalRit);

      var sumBasic = document.getElementById('liveSumBasic');
      if (sumBasic) sumBasic.innerText = formatRupiahVal(basic);

      var sumOt = document.getElementById('liveSumOvertime');
      if (sumOt) sumOt.innerText = formatRupiahVal(subtotalOt);

      var sumSPL = document.getElementById('liveSumSPL');
      if (sumSPL) sumSPL.innerText = formatRupiahVal(subtotalSPL);

      var sumRit = document.getElementById('liveSumRitase');
      if (sumRit) sumRit.innerText = formatRupiahVal(subtotalRit);

      var sumTunj = document.getElementById('liveSumTunjangan');
      if (sumTunj) sumTunj.innerText = formatRupiahVal(tunjangan);

      var sumTotal = document.getElementById('liveSumTotalGaji');
      if (sumTotal) sumTotal.innerText = formatRupiahVal(grandTotalGaji);
    };

    // --- SUBMIT FORM ---
    window.submitDataGaji = function (e) {
      if (e && e.preventDefault) e.preventDefault();

      if (isCurrentPeriodClosed) {
        Swal.fire('Periode Ditutup Buku', 'Periode payroll ini sudah ditutup. Data tidak dapat disimpan.', 'warning');
        return;
      }

      var editId = document.getElementById('gajiEditId').value.trim();
      var periodIdVal = document.getElementById('gajiPeriodIdHidden') ? document.getElementById('gajiPeriodIdHidden').value.trim() : '';
      if (!periodIdVal) periodIdVal = currentSelectedPeriodId || (currentActivePeriodInfo ? currentActivePeriodInfo.id : '');

      var tanggal = document.getElementById('gajiTanggal').value.trim();
      var dept = document.getElementById('gajiDeptSelect').value.trim();
      var empId = document.getElementById('gajiEmpIdHidden').value.trim() || document.getElementById('gajiEmpSelect').value.trim();
      var empName = document.getElementById('gajiEmpNameHidden').value.trim();
      var jabatan = document.getElementById('gajiJabatanDisplay').value.trim();
      var basic = Number(document.getElementById('gajiBasicNumeric').value) || 0;

      if (!tanggal) {
        showFormValidationWarning('gajiTanggal', 'Tanggal kerja wajib diisi.');
        return;
      }
      if (!dept) {
        showFormValidationWarning('gajiDeptSelect', 'Departemen wajib dipilih.');
        return;
      }
      if (!empId) {
        showFormValidationWarning('gajiEmpSelect', 'Nama Karyawan wajib dipilih.');
        return;
      }

      var jamOt = parseFloat(document.getElementById('gajiJamOvertime').value) || 0;
      var tarifOt = parseRupiahVal(document.getElementById('gajiTarifOvertime').value);
      var subtotalOt = jamOt * tarifOt;

      var jamSPL = parseFloat(document.getElementById('gajiJamSPL').value) || 0;
      var tarifSPL = parseRupiahVal(document.getElementById('gajiTarifSPL').value);
      var subtotalSPL = jamSPL * tarifSPL;

      var ritase = parseFloat(document.getElementById('gajiRitase').value) || 0;
      var tarifRit = parseRupiahVal(document.getElementById('gajiTarifRitase').value);
      var subtotalRit = ritase * tarifRit;

      var tunjangan = parseRupiahVal(document.getElementById('gajiTunjanganHarian').value);
      var catatan = document.getElementById('gajiCatatan').value.trim();

      var totalHariIni = subtotalOt + subtotalSPL + subtotalRit + tunjangan;

      var splIdVal = document.getElementById('gajiSplIdHidden') ? document.getElementById('gajiSplIdHidden').value.trim() : '';

      var payload = {
        id: editId,
        periodId: periodIdVal,
        tanggal: tanggal,
        dept: dept,
        empId: empId,
        empName: empName,
        jabatan: jabatan,
        basic: basic,
        jamOvertime: jamOt,
        tarifOvertime: tarifOt,
        jamSPL: jamSPL,
        tarifSPL: tarifSPL,
        splId: splIdVal,
        ritase: ritase,
        tarifRitase: tarifRit,
        tunjanganHarian: tunjangan,
        catatan: catatan
      };

      var splNoteInConfirm = splIdVal ? ' <span class="badge bg-success-subtle text-success border border-success-subtle extra-small ms-1">Auto SPL ' + escapeHTML(splIdVal) + '</span>' : '';

      var confirmHtml =
        '<div class="text-start extra-small p-2.5 rounded bg-light border mb-2">' +
        '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Tanggal Kerja:</span><strong class="text-dark">' + escapeHTML(formatDateWithDay(tanggal)) + '</strong></div>' +
        '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Karyawan:</span><strong class="text-dark">' + escapeHTML(empName) + ' (' + escapeHTML(empId) + ')</strong></div>' +
        '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Gaji Pokok (Basic):</span><strong>' + formatRupiahVal(basic) + '</strong></div>' +
        '<hr class="my-1">' +
        '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Overtime Hari Ini:</span><span>' + jamOt + ' Jam @ ' + formatRupiahVal(tarifOt) + ' = <strong>' + formatRupiahVal(subtotalOt) + '</strong></span></div>' +
        '<div class="d-flex justify-content-between mb-1"><span class="text-muted">SPL Hari Ini:</span><span>' + jamSPL + ' Jam @ ' + formatRupiahVal(tarifSPL) + ' = <strong>' + formatRupiahVal(subtotalSPL) + '</strong>' + splNoteInConfirm + '</span></div>' +
        '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Ritase Hari Ini:</span><span>' + ritase + ' Rit @ ' + formatRupiahVal(tarifRit) + ' = <strong>' + formatRupiahVal(subtotalRit) + '</strong></span></div>' +
        '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Tunjangan Hari Ini:</span><strong>' + formatRupiahVal(tunjangan) + '</strong></div>' +
        '<hr class="my-1">' +
        '<div class="d-flex justify-content-between fs-6"><span class="fw-bold text-dark">Penghasilan Hari Ini:</span><strong class="text-success">' + formatRupiahVal(totalHariIni) + '</strong></div>' +
        '</div>';

      Swal.fire({
        title: editId ? 'Perbarui Data Gaji?' : 'Simpan Data Gaji Harian?',
        html: confirmHtml,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: '<i class="bi bi-save me-1"></i>Ya, Simpan',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#2563eb'
      }).then(function (res) {
        if (!res.isConfirmed) return;

        showFullPageLoading('Menyimpan data gaji...');

        gasRun('saveDataGaji', Auth.getToken(), payload).then(function (resp) {
          hideFullPageLoading();
          if (handleSessionExpired(resp)) return;

          if (resp && resp.success) {
            if (bsModalDataGaji) bsModalDataGaji.hide();
            Swal.fire({
              icon: 'success',
              title: 'Berhasil Disimpan',
              text: resp.message || 'Data gaji berhasil disimpan.',
              timer: 2000,
              showConfirmButton: false
            });

            // Langsung tambahkan atau perbarui item di memori agar perubahan seketika tampil di UI
            if (resp.item) {
              var existingIdx = cachedDataGajiLogs.findIndex(function (l) { return l.id === resp.item.id; });
              if (existingIdx !== -1) {
                cachedDataGajiLogs[existingIdx] = resp.item;
              } else {
                cachedDataGajiLogs.unshift(resp.item);
              }
              renderDataGajiTable();
              if (currentRincianEmpId && bsModalRincianGaji) {
                renderRincianModal(currentRincianEmpId);
              }
            }

            loadDataGajiList();
          } else {
            Swal.fire('Gagal Menyimpan', (resp && resp.message) || 'Terjadi kesalahan sistem.', 'error');
          }
        }).catch(function (err) {
          hideFullPageLoading();
          Swal.fire('Error', err.toString(), 'error');
        });
      });
    };

    // --- MODAL 2: RINCIAN RIWAYAT GAJI KARYAWAN ---
    window.openRincianEmp = function (empId) {
      currentRincianEmpId = empId;
      currentPageRincianLog = 1;
      var modalEl = document.getElementById('modalRincianGaji');
      if (!modalEl) return;
      if (!bsModalRincianGaji) {
        bsModalRincianGaji = new bootstrap.Modal(modalEl);
      }

      renderRincianModal(empId);
      bsModalRincianGaji.show();
    };

    function renderRincianModal(empId) {
      var emp = (dbKaryawan || []).find(function (k) { return matchLogToEmp({ empId: empId, empName: empId }, k); });
      if (!emp) {
        var sampleLog = cachedDataGajiLogs.find(function (l) {
          return matchLogToEmp(l, { id: empId, name: empId });
        });
        if (sampleLog) {
          emp = {
            id: sampleLog.empId || empId,
            name: sampleLog.empName || empId,
            dept: sampleLog.dept || '-',
            jabatan: sampleLog.jabatan || '-',
            gajiPokok: sampleLog.basic || 0
          };
        } else {
          emp = {
            id: empId,
            name: empId,
            dept: '-',
            jabatan: '-',
            gajiPokok: 0
          };
        }
      }

      var titleEl = document.getElementById('rincianEmpTitle');
      if (titleEl) {
        titleEl.innerText = emp.name + ' (' + emp.id + ')';
        titleEl.className = 'text-white fw-bold';
        titleEl.style.color = '#ffffff';
      }

      var deptJabatanEl = document.getElementById('rincianEmpDeptJabatan');
      if (deptJabatanEl) deptJabatanEl.innerText = (emp.dept || '-') + ' / ' + (emp.jabatan || '-');

      var basicVal = Number(emp.gajiPokok) || 0;
      var basicEl = document.getElementById('rincianEmpBasic');
      if (basicEl) basicEl.innerText = formatRupiahVal(basicVal);

      // Ambil semua log karyawan ini dengan pencocokan fleksibel
      var kLogs = cachedDataGajiLogs.filter(function (log) {
        return matchLogToEmp(log, emp);
      });

      var totalJamOt = 0;
      var totalNominalOt = 0;
      var totalJamSPL = 0;
      var totalNominalSPL = 0;
      var totalRitase = 0;
      var totalNominalRit = 0;
      var totalTunjangan = 0;

      kLogs.forEach(function (log) {
        totalJamOt += Number(log.jamOvertime || 0);
        totalNominalOt += Number(log.totalOvertime || 0);
        totalJamSPL += Number(log.jamSPL || 0);
        totalNominalSPL += Number(log.totalSPL || 0);
        totalRitase += Number(log.ritase || 0);
        totalNominalRit += Number(log.totalRitase || 0);
        totalTunjangan += Number(log.tunjanganHarian || 0);
      });

      var empSummary = (cachedDataGajiEmployees || []).find(function (s) {
        return matchLogToEmp({ empId: s.id, empName: s.name }, emp);
      });

      var isBpjsKesOff = (emp.bpjsKesSetting === 'Tidak Ikut' || emp.bpjsKesSetting === 'Non Aktif');
      var isBpjsTKOff = (emp.bpjsTKSetting === 'Tidak Ikut' || emp.bpjsTKSetting === 'Non Aktif');

      var potKes = isBpjsKesOff ? 0 : (empSummary ? (Number(empSummary.potonganBPJSKes) || 0) : (Number(emp.bpjsKesNominal) || 0));
      var potTk = isBpjsTKOff ? 0 : (empSummary ? (Number(empSummary.potonganBPJSTK) || 0) : (Number(emp.bpjsTKNominal) || 0));
      var potPph = (empSummary && empSummary.potonganPPh21 !== undefined) ? (Number(empSummary.potonganPPh21) || 0) : (Number(emp.pph21Nominal) || 0);
      var potKasbon = empSummary ? (Number(empSummary.potonganKasbon) || 0) : 0;
      var catKasbon = empSummary ? (empSummary.catatanKasbon || '') : '';
      var potLain = empSummary ? (Number(empSummary.potonganLain) || 0) : 0;
      var catPotLain = empSummary ? (empSummary.catatanPotonganLain || '') : '';

      var pkwtNom = empSummary ? (Number(empSummary.kompensasiPKWT) || 0) : 0;
      var pkwtTgl = empSummary ? (empSummary.tanggalKompensasiPKWT || '') : '';
      var pkwtCat = empSummary ? (empSummary.keteranganPKWT || '') : '';

      var totalKlaim = empSummary ? (Number(empSummary.totalKlaim) || 0) : 0;
      var klaimTravel = empSummary ? (Number(empSummary.klaimTravel) || 0) : 0;
      var klaimMCU = empSummary ? (Number(empSummary.klaimMCU) || 0) : 0;
      var klaimLainnya = empSummary ? (Number(empSummary.klaimLainnya) || 0) : 0;
      var listKlaim = (empSummary && Array.isArray(empSummary.listKlaim)) ? empSummary.listKlaim : [];

      var totalPotPokok = potKes + potTk + potPph;
      var gajiPokokBersih = Math.max(0, basicVal - totalPotPokok);
      var totalTambahan = totalNominalOt + totalNominalSPL + totalNominalRit + totalTunjangan;
      var grandTotalBruto = basicVal + totalTambahan + pkwtNom + totalKlaim;
      var gajiSebelumKasbon = gajiPokokBersih + totalTambahan + pkwtNom + totalKlaim;
      var totalPotongan = totalPotPokok + potKasbon + potLain;
      var takeHomePay = Math.max(0, grandTotalBruto - totalPotongan);

      var elPotPokok = document.getElementById('rincianEmpPotPokok');
      if (elPotPokok) elPotPokok.innerText = 'Potongan Pokok: -' + formatRupiahVal(totalPotPokok);
      var elPokokBersih = document.getElementById('rincianEmpPokokBersih');
      if (elPokokBersih) elPokokBersih.innerText = formatRupiahVal(gajiPokokBersih);
      var elHariKerja = document.getElementById('rincianEmpHariKerja');
      if (elHariKerja) elHariKerja.innerText = kLogs.length + ' Hari Kerja';
      var elTambahan = document.getElementById('rincianEmpTambahan');
      if (elTambahan) elTambahan.innerText = formatRupiahVal(totalTambahan);

      var boxPKWT = document.getElementById('boxRincianPKWT');
      if (boxPKWT) {
        if (pkwtNom > 0) {
          boxPKWT.style.display = 'block';
          var elPKWTVal = document.getElementById('rincianEmpPKWT');
          if (elPKWTVal) elPKWTVal.innerText = '+ ' + formatRupiahVal(pkwtNom);
          var elPKWTCat = document.getElementById('rincianEmpCatPKWT');
          if (elPKWTCat) elPKWTCat.innerText = (pkwtTgl ? safeFormatDateDMY(pkwtTgl) + ': ' : '') + (pkwtCat || 'Kompensasi PKWT');
        } else {
          boxPKWT.style.display = 'none';
        }
      }

      var boxKlaim = document.getElementById('boxRincianKlaim');
      if (boxKlaim) {
        if (totalKlaim > 0) {
          boxKlaim.style.display = 'block';
          var elKlaimVal = document.getElementById('rincianEmpKlaim');
          if (elKlaimVal) elKlaimVal.innerText = '+ ' + formatRupiahVal(totalKlaim);
          var elKlaimCat = document.getElementById('rincianEmpCatKlaim');
          if (elKlaimCat) {
            var kParts = [];
            if (klaimTravel > 0) kParts.push('Travel: ' + formatRupiahVal(klaimTravel));
            if (klaimMCU > 0) kParts.push('MCU: ' + formatRupiahVal(klaimMCU));
            if (klaimLainnya > 0) kParts.push('Lain: ' + formatRupiahVal(klaimLainnya));
            elKlaimCat.innerText = kParts.join(' | ') || (listKlaim.length + ' Transaksi Klaim');
          }
        } else {
          boxKlaim.style.display = 'none';
        }
      }

      var elSblmKasbon = document.getElementById('rincianEmpSblmKasbon');
      if (elSblmKasbon) elSblmKasbon.innerText = formatRupiahVal(gajiSebelumKasbon);
      var elKasbon = document.getElementById('rincianEmpKasbon');
      if (elKasbon) elKasbon.innerText = '- ' + formatRupiahVal(potKasbon);
      var elCatKasbon = document.getElementById('rincianEmpCatKasbon');
      if (elCatKasbon) elCatKasbon.innerText = catKasbon || '-';
      var elTotPot = document.getElementById('rincianEmpTotalPotongan');
      if (elTotPot) elTotPot.innerText = '- ' + formatRupiahVal(totalPotongan);
      var grandTotalEl = document.getElementById('rincianEmpGrandTotal');
      if (grandTotalEl) grandTotalEl.innerText = formatRupiahVal(takeHomePay);

      var countBadge = document.getElementById('rincianLogCount');
      if (countBadge) countBadge.innerText = kLogs.length + ' Hari Kerja';

      // Kontrol tombol "+ Input Harian Baru" di dalam modal rincian jika periode ditutup
      var btnAddRincian = document.getElementById('btnRincianAddToday');
      if (btnAddRincian) {
        btnAddRincian.style.display = isCurrentPeriodClosed ? 'none' : 'inline-block';
      }

      // Render Tabel Log dengan Pagination
      var tbody = document.getElementById('tableBodyRincianLog');
      var pagContainer = document.getElementById('paginationRincianLog');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (kLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">Belum ada catatan log kerja harian untuk karyawan ini. ' +
          (isCurrentPeriodClosed ? '<span class="text-danger fw-semibold">(Periode Ditutup Buku)</span>' : 'Klik tombol "+ Input Harian Baru" untuk menambahkan.') + '</td></tr>';
        if (pagContainer) pagContainer.innerHTML = '';
        return;
      }

      var totalLogs = kLogs.length;
      var effectivePageSize = pageSizeRincianLog > 0 ? pageSizeRincianLog : totalLogs;
      var totalPages = Math.ceil(totalLogs / effectivePageSize) || 1;
      if (currentPageRincianLog > totalPages) currentPageRincianLog = totalPages;
      if (currentPageRincianLog < 1) currentPageRincianLog = 1;

      var startIdx = (currentPageRincianLog - 1) * effectivePageSize;
      var endIdx = Math.min(startIdx + effectivePageSize, totalLogs);
      var pageLogs = kLogs.slice(startIdx, endIdx);

      pageLogs.forEach(function (log, idx) {
        var rowNo = startIdx + idx + 1;
        var jOt = Number(log.jamOvertime || 0);
        var subOt = Number(log.totalOvertime || (jOt * Number(log.tarifOvertime || 0)));
        var jSPL = Number(log.jamSPL || 0);
        var subSPL = Number(log.totalSPL || (jSPL * Number(log.tarifSPL || 0)));
        var rit = Number(log.ritase || 0);
        var subRit = Number(log.totalRitase || (rit * Number(log.tarifRitase || 0)));
        var tunj = Number(log.tunjanganHarian || 0);
        var totalHariItu = subOt + subSPL + subRit + tunj;

        var otStr = jOt > 0
          ? '<span class="fw-semibold text-primary">' + formatRupiahVal(subOt) + '</span><br><small class="text-muted extra-small">' + jOt + ' Jam</small>'
          : '<span class="text-muted extra-small">-</span>';

        var splBadge = log.splId ? ' <span class="badge bg-success-subtle text-success border border-success-subtle extra-small" style="font-size: 0.65rem;" title="ID SPL: ' + escapeHTML(log.splId) + '">SPL</span>' : '';
        var splStr = jSPL > 0
          ? '<span class="fw-semibold text-success">' + formatRupiahVal(subSPL) + '</span>' + splBadge + '<br><small class="text-muted extra-small">' + jSPL + ' Jam</small>'
          : '<span class="text-muted extra-small">-</span>';

        var ritStr = rit > 0
          ? '<span class="fw-semibold text-warning">' + formatRupiahVal(subRit) + '</span><br><small class="text-muted extra-small">' + rit + ' Rit</small>'
          : '<span class="text-muted extra-small">-</span>';

        var actionRowHtml = isCurrentPeriodClosed
          ? '<span class="badge bg-light text-muted border extra-small"><i class="bi bi-lock me-1"></i>Terkunci</span>'
          : '  <div class="action-group">' +
          '    <button class="btn btn-sm btn-action btn-action-edit" onclick="editLogFromRincian(\'' + escapeHTML(log.id) + '\')" title="Edit"><i class="bi bi-pencil-square"></i>Edit</button>' +
          '    <button class="btn btn-sm btn-action btn-action-delete" onclick="deleteLogFromRincian(\'' + escapeHTML(log.id) + '\', \'' + escapeHTML(log.tanggal) + '\')" title="Hapus"><i class="bi bi-trash"></i>Hapus</button>' +
          '  </div>';

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="text-center text-muted extra-small text-nowrap">' + rowNo + '</td>' +
          '<td class="fw-bold text-nowrap"><i class="bi bi-calendar-event me-1 text-primary"></i>' + escapeHTML(formatDateWithDay(log.tanggal)) + '</td>' +
          '<td class="text-end text-nowrap">' + otStr + '</td>' +
          '<td class="text-end text-nowrap">' + splStr + '</td>' +
          '<td class="text-end text-nowrap">' + ritStr + '</td>' +
          '<td class="text-end fw-semibold text-nowrap">' + (tunj > 0 ? formatRupiahVal(tunj) : '<span class="text-muted extra-small">-</span>') + '</td>' +
          '<td class="text-end text-nowrap"><span class="badge bg-success text-white px-2.5 py-1.5" style="font-size: 0.85rem; font-weight: 700; box-shadow: 0 1px 2px rgba(16,185,129,0.25);">' + formatRupiahVal(totalHariItu) + '</span></td>' +
          '<td class="text-nowrap"><small class="text-muted">' + escapeHTML(log.catatan || '-') + '</small></td>' +
          '<td class="text-center text-nowrap">' +
          actionRowHtml +
          '</td>';

        tbody.appendChild(tr);
      });

      renderPaginationRincianLog(totalLogs, currentPageRincianLog);
    }

    window.setRincianLogPage = function (newPage) {
      currentPageRincianLog = newPage;
      if (currentRincianEmpId) {
        renderRincianModal(currentRincianEmpId);
      }
    };

    window.changePageSizeRincianLog = function (newSize) {
      pageSizeRincianLog = parseInt(newSize, 10);
      currentPageRincianLog = 1;
      if (currentRincianEmpId) {
        renderRincianModal(currentRincianEmpId);
      }
    };

    function renderPaginationRincianLog(totalItems, currentPage) {
      var container = document.getElementById('paginationRincianLog');
      if (!container) return;

      if (!totalItems || totalItems === 0) {
        container.innerHTML = '';
        return;
      }

      var effectivePageSize = pageSizeRincianLog > 0 ? pageSizeRincianLog : totalItems;
      var totalPages = Math.ceil(totalItems / effectivePageSize) || 1;
      var startItem = (currentPage - 1) * effectivePageSize + 1;
      var endItem = Math.min(currentPage * effectivePageSize, totalItems);

      var sizeOptions = [5, 10, 15, 25, 50];
      var sizeOptionsHtml = '<select class="form-select form-select-sm py-0 px-2 extra-small border-secondary-subtle" style="width: auto; height: 26px; font-size: 0.75rem; display: inline-block;" onchange="changePageSizeRincianLog(this.value)">';
      sizeOptions.forEach(function (s) {
        sizeOptionsHtml += '<option value="' + s + '" ' + (pageSizeRincianLog === s ? 'selected' : '') + '>' + s + ' / hal</option>';
      });
      sizeOptionsHtml += '<option value="-1" ' + (pageSizeRincianLog === -1 ? 'selected' : '') + '>Semua</option>';
      sizeOptionsHtml += '</select>';

      var html = '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 px-3 py-2 border border-top-0 rounded-bottom bg-light shadow-sm">' +
        '<div class="d-flex align-items-center gap-2 extra-small text-muted fw-semibold">' +
        '  <span>Tampilkan:</span>' +
        sizeOptionsHtml +
        '  <span class="ms-1 text-secondary">(' + startItem + ' - ' + endItem + ' dari ' + totalItems + ' entri harian)</span>' +
        '</div>' +
        '<nav><ul class="pagination pagination-sm m-0">';

      if (currentPage === 1) {
        html += '<li class="page-item disabled"><span class="page-link py-1 px-2 extra-small"><i class="bi bi-chevron-left"></i></span></li>';
      } else {
        html += '<li class="page-item"><a class="page-link py-1 px-2 extra-small" href="javascript:void(0)" onclick="setRincianLogPage(' + (currentPage - 1) + ')" title="Halaman Sebelumnya"><i class="bi bi-chevron-left"></i></a></li>';
      }

      for (var p = 1; p <= totalPages; p++) {
        if (p === currentPage) {
          html += '<li class="page-item active"><span class="page-link py-1 px-2.5 extra-small fw-bold">' + p + '</span></li>';
        } else if (p === 1 || p === totalPages || (p >= currentPage - 1 && p <= currentPage + 1)) {
          html += '<li class="page-item"><a class="page-link py-1 px-2.5 extra-small" href="javascript:void(0)" onclick="setRincianLogPage(' + p + ')">' + p + '</a></li>';
        } else if (p === 2 || p === totalPages - 1) {
          html += '<li class="page-item disabled"><span class="page-link py-1 px-1.5 extra-small">...</span></li>';
        }
      }

      if (currentPage === totalPages || totalPages === 0) {
        html += '<li class="page-item disabled"><span class="page-link py-1 px-2 extra-small"><i class="bi bi-chevron-right"></i></span></li>';
      } else {
        html += '<li class="page-item"><a class="page-link py-1 px-2 extra-small" href="javascript:void(0)" onclick="setRincianLogPage(' + (currentPage + 1) + ')" title="Halaman Selanjutnya"><i class="bi bi-chevron-right"></i></a></li>';
      }

      html += '</ul></nav></div>';
      container.innerHTML = html;
    }

    window.openInputFromRincian = function () {
      if (isCurrentPeriodClosed) {
        Swal.fire('Periode Ditutup Buku', 'Periode payroll ini sudah ditutup. Data tidak dapat ditambahkan.', 'warning');
        return;
      }
      if (!currentRincianEmpId) return;
      var emp = (dbKaryawan || []).find(function (k) { return String(k.id).toLowerCase() === String(currentRincianEmpId).toLowerCase(); });
      if (!emp) return;
      openModalDataGaji(null, emp);
    };

    window.openModalBukaPeriode = function () {
      var modalEl = document.getElementById('modalBukaPeriode');
      if (!modalEl) return;
      if (!bsModalBukaPeriode) {
        bsModalBukaPeriode = new bootstrap.Modal(modalEl);
      }

      var formEl = document.getElementById('formBukaPeriode');
      if (formEl) formEl.reset();

      var now = new Date();
      var BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      var currentMonthName = BULAN_ID[now.getMonth()];

      var nameInput = document.getElementById('inputBukaPeriodeName');
      var startInput = document.getElementById('inputBukaPeriodeStartDate');
      var endInput = document.getElementById('inputBukaPeriodeEndDate');
      var autoCloseCheck = document.getElementById('checkBukaPeriodeAutoClose');

      if (autoCloseCheck) autoCloseCheck.checked = true;

      if (nameInput) {
        nameInput.value = 'Payroll ' + currentMonthName + ' ' + now.getFullYear();
      }

      // Default cut-off dates
      var lastEndDate = null;
      if (currentActivePeriodInfo && currentActivePeriodInfo.endDate) {
        try {
          var pEnd = new Date(currentActivePeriodInfo.endDate);
          if (!isNaN(pEnd.getTime())) {
            pEnd.setDate(pEnd.getDate() + 1);
            lastEndDate = pEnd;
          }
        } catch (e) { }
      }

      if (lastEndDate) {
        var sYear = lastEndDate.getFullYear();
        var sMonth = String(lastEndDate.getMonth() + 1).padStart(2, '0');
        var sDay = String(lastEndDate.getDate()).padStart(2, '0');
        if (startInput) startInput.value = sYear + '-' + sMonth + '-' + sDay;

        var nextEnd = new Date(lastEndDate.getTime());
        nextEnd.setMonth(nextEnd.getMonth() + 1);
        nextEnd.setDate(nextEnd.getDate() - 1);
        var eYear = nextEnd.getFullYear();
        var eMonth = String(nextEnd.getMonth() + 1).padStart(2, '0');
        var eDay = String(nextEnd.getDate()).padStart(2, '0');
        if (endInput) endInput.value = eYear + '-' + eMonth + '-' + eDay;
      } else {
        var yyyy = now.getFullYear();
        var mm = String(now.getMonth() + 1).padStart(2, '0');
        var prevMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 21);
        var prevY = prevMonthDate.getFullYear();
        var prevM = String(prevMonthDate.getMonth() + 1).padStart(2, '0');
        if (startInput) startInput.value = prevY + '-' + prevM + '-21';
        if (endInput) endInput.value = yyyy + '-' + mm + '-20';
      }

      bsModalBukaPeriode.show();
    };

    // --- EXPORT PERIODE PAYROLL KE EXCEL (.XLSX) MULTI-SHEET ---
    window.exportPeriodePayrollToExcel = function () {
      if (typeof XLSX === 'undefined') {
        Swal.fire('Error', 'Library SheetJS (XLSX) belum siap dimuat.', 'error');
        return;
      }

      var targetPeriod = (cachedPeriodeList || []).find(function (p) { return p.id === currentSelectedPeriodId; }) || currentActivePeriodInfo;
      if (!targetPeriod) {
        Swal.fire('Peringatan', 'Pilih periode payroll yang ingin diexport.', 'warning');
        return;
      }

      var pName = targetPeriod.name || targetPeriod.nama || targetPeriod.id;
      var sDate = targetPeriod.startDate ? safeFormatDateDMY(targetPeriod.startDate) : '-';
      var eDate = targetPeriod.endDate ? safeFormatDateDMY(targetPeriod.endDate) : '-';
      var now = new Date();
      var tanggalCetak = now.getDate() + '/' + (now.getMonth() + 1) + '/' + now.getFullYear() + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      // 1. Petakan setiap karyawan
      var matchedLogIds = new Set();
      var empList = (Array.isArray(dbKaryawan) ? dbKaryawan : []).map(function (k) {
        var kLogs = cachedDataGajiLogs.filter(function (log) {
          var match = matchLogToEmp(log, k);
          if (match && log.id) matchedLogIds.add(log.id);
          return match;
        });

        var totalJamOt = 0, totalNominalOt = 0;
        var totalJamSPL = 0, totalNominalSPL = 0;
        var totalRitase = 0, totalNominalRit = 0;
        var totalTunjangan = 0;
        kLogs.forEach(function (log) {
          totalJamOt += Number(log.jamOvertime || 0);
          totalNominalOt += Number(log.totalOvertime || 0);
          totalJamSPL += Number(log.jamSPL || 0);
          totalNominalSPL += Number(log.totalSPL || 0);
          totalRitase += Number(log.ritase || 0);
          totalNominalRit += Number(log.totalRitase || 0);
          totalTunjangan += Number(log.tunjanganHarian || 0);
        });

        var basic = Number(k.gajiPokok || 0);
        return {
          id: k.id,
          name: k.name,
          dept: k.dept || '-',
          jabatan: k.jabatan || '-',
          basic: basic,
          daysCount: kLogs.length,
          totalJamOt: totalJamOt,
          totalNominalOt: totalNominalOt,
          totalJamSPL: totalJamSPL,
          totalNominalSPL: totalNominalSPL,
          totalRitase: totalRitase,
          totalNominalRit: totalNominalRit,
          totalTunjangan: totalTunjangan,
          grandTotal: basic + totalNominalOt + totalNominalSPL + totalNominalRit + totalTunjangan,
          logs: kLogs
        };
      });

      // Masukkan log unmapped jika ada
      var unmappedLogs = cachedDataGajiLogs.filter(function (l) { return l.id && !matchedLogIds.has(l.id); });
      var groupedUnmapped = {};
      unmappedLogs.forEach(function (log) {
        var key = String(log.empId || log.empName || 'UNKNOWN').trim().toLowerCase();
        if (!groupedUnmapped[key]) {
          groupedUnmapped[key] = {
            id: log.empId || key,
            name: log.empName || log.empId || 'Karyawan',
            dept: log.dept || '-',
            jabatan: log.jabatan || '-',
            basic: Number(log.basic || 0),
            logs: []
          };
        }
        groupedUnmapped[key].logs.push(log);
      });

      Object.keys(groupedUnmapped).forEach(function (kKey) {
        var g = groupedUnmapped[kKey];
        var totalJamOt = 0, totalNominalOt = 0;
        var totalJamSPL = 0, totalNominalSPL = 0;
        var totalRitase = 0, totalNominalRit = 0;
        var totalTunjangan = 0;
        g.logs.forEach(function (log) {
          totalJamOt += Number(log.jamOvertime || 0);
          totalNominalOt += Number(log.totalOvertime || 0);
          totalJamSPL += Number(log.jamSPL || 0);
          totalNominalSPL += Number(log.totalSPL || 0);
          totalRitase += Number(log.ritase || 0);
          totalNominalRit += Number(log.totalRitase || 0);
          totalTunjangan += Number(log.tunjanganHarian || 0);
        });
        var basic = Number(g.basic || 0);
        empList.push({
          id: g.id,
          name: g.name,
          dept: g.dept,
          jabatan: g.jabatan,
          basic: basic,
          daysCount: g.logs.length,
          totalJamOt: totalJamOt,
          totalNominalOt: totalNominalOt,
          totalJamSPL: totalJamSPL,
          totalNominalSPL: totalNominalSPL,
          totalRitase: totalRitase,
          totalNominalRit: totalNominalRit,
          totalTunjangan: totalTunjangan,
          grandTotal: basic + totalNominalOt + totalNominalSPL + totalNominalRit + totalTunjangan,
          logs: g.logs
        });
      });

      empList.sort(function (a, b) {
        if (b.daysCount !== a.daysCount) return b.daysCount - a.daysCount;
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      // SHEET 1: REKAP TOTAL GAJI
      var s1Data = [
        ['PT. BERKAH BATU BARA'],
        ['REKAPITULASI PENGGAJIAN KARYAWAN (PAYROLL SUMMARY)'],
        ['Periode: ' + pName, '', 'Cut-Off: ' + sDate + ' s/d ' + eDate, '', 'Status: ' + targetPeriod.status, '', 'Diexport Pada: ' + tanggalCetak],
        []
      ];

      var s1Headers = [
        'No',
        'ID Karyawan',
        'Nama Karyawan',
        'Departemen',
        'Jabatan',
        'Gaji Pokok',
        'Jam Overtime',
        'Nominal Overtime',
        'Jam SPL',
        'Nominal SPL',
        'Total Ritase',
        'Nominal Ritase',
        'Total Tunjangan',
        'Kompensasi PKWT',
        'Tgl Kompensasi PKWT',
        'Keterangan PKWT',
        'Total Gaji Bruto',
        'Potongan BPJS Kes',
        'Potongan BPJS TK',
        'Potongan PPh 21',
        'Gaji Pokok Bersih',
        'Pinjaman / Kasbon',
        'Catatan Kasbon',
        'Potongan Lain',
        'Total Potongan',
        'TAKE HOME PAY (THP)',
        'Hari Kerja'
      ];
      s1Data.push(s1Headers);

      var sumBasic = 0, sumJamOt = 0, sumNomOt = 0, sumJamSPL = 0, sumNomSPL = 0, sumRit = 0, sumNomRit = 0, sumTunj = 0, sumPKWT = 0, sumGrandTotal = 0, sumDays = 0;

      empList.forEach(function (emp, idx) {
        sumBasic += emp.basic;
        sumJamOt += emp.totalJamOt;
        sumNomOt += emp.totalNominalOt;
        sumJamSPL += (emp.totalJamSPL || 0);
        sumNomSPL += (emp.totalNominalSPL || 0);
        sumRit += emp.totalRitase;
        sumNomRit += emp.totalNominalRit;
        sumTunj += emp.totalTunjangan;
        sumGrandTotal += emp.grandTotal;
        sumDays += emp.daysCount;

        var sEmpSum = (cachedDataGajiEmployees || []).find(function (s) { return matchLogToEmp({ empId: s.id, empName: s.name }, emp); });
        var eKes = sEmpSum ? (Number(sEmpSum.potonganBPJSKes) || 0) : (Number(emp.bpjsKesNominal) || 0);
        var eTk = sEmpSum ? (Number(sEmpSum.potonganBPJSTK) || 0) : (Number(emp.bpjsTKNominal) || 0);
        var ePph = sEmpSum ? (Number(sEmpSum.potonganPPh21) || 0) : (Number(emp.pph21Nominal) || 0);
        var eKas = sEmpSum ? (Number(sEmpSum.potonganKasbon) || 0) : 0;
        var eCatKas = sEmpSum ? (sEmpSum.catatanKasbon || '') : '';
        var eLain = sEmpSum ? (Number(sEmpSum.potonganLain) || 0) : 0;
        var ePKWT = sEmpSum ? (Number(sEmpSum.kompensasiPKWT) || 0) : (Number(emp.kompensasiPKWT) || 0);
        var eTglPKWT = sEmpSum ? (sEmpSum.tanggalKompensasiPKWT || '') : (emp.tanggalKompensasiPKWT || '');
        var eKetPKWT = sEmpSum ? (sEmpSum.keteranganPKWT || '') : (emp.keteranganPKWT || '');
        sumPKWT += ePKWT;

        var ePotPokok = eKes + eTk + ePph;
        var ePokokBersih = Math.max(0, emp.basic - ePotPokok);
        var eTotPot = ePotPokok + eKas + eLain;
        var eTHP = Math.max(0, emp.grandTotal - eTotPot);

        s1Data.push([
          idx + 1,
          emp.id,
          emp.name,
          emp.dept,
          emp.jabatan,
          emp.basic,
          emp.totalJamOt,
          emp.totalNominalOt,
          emp.totalJamSPL || 0,
          emp.totalNominalSPL || 0,
          emp.totalRitase,
          emp.totalNominalRit,
          emp.totalTunjangan,
          ePKWT,
          eTglPKWT,
          eKetPKWT,
          emp.grandTotal,
          eKes,
          eTk,
          ePph,
          ePokokBersih,
          eKas,
          eCatKas,
          eLain,
          eTotPot,
          eTHP,
          emp.daysCount
        ]);
      });

      s1Data.push([
        '',
        '',
        '',

    // =========================================================================
    // FUNGSI KONVERSI ANGKA TERBILANG (BAHASA INDONESIA RESMI)
    // =========================================================================
    function angkaTerbilang(nilai) {
      nilai = Math.floor(Math.abs(Number(nilai) || 0));
      if (nilai === 0) return 'Nol Rupiah';

      var satuan = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];

      function terbilangBawahSeribu(n) {
        if (n < 12) return satuan[n];
        if (n < 20) return terbilangBawahSeribu(n - 10) + ' Belas';
        if (n < 100) return satuan[Math.floor(n / 10)] + ' Puluh' + (n % 10 > 0 ? ' ' + satuan[n % 10] : '');
        if (n < 200) return 'Seratus' + (n - 100 > 0 ? ' ' + terbilangBawahSeribu(n - 100) : '');
        return satuan[Math.floor(n / 100)] + ' Ratus' + (n % 100 > 0 ? ' ' + terbilangBawahSeribu(n % 100) : '');
      }

      var hasil = '';
      if (nilai >= 1000000000000) {
        hasil += terbilangBawahSeribu(Math.floor(nilai / 1000000000000)) + ' Triliun ';
        nilai %= 1000000000000;
      }
      if (nilai >= 1000000000) {
        hasil += terbilangBawahSeribu(Math.floor(nilai / 1000000000)) + ' Miliar ';
        nilai %= 1000000000;
      }
      if (nilai >= 1000000) {
        hasil += terbilangBawahSeribu(Math.floor(nilai / 1000000)) + ' Juta ';
        nilai %= 1000000;
      }
      if (nilai >= 1000) {
        var ribu = Math.floor(nilai / 1000);
        hasil += (ribu === 1 ? 'Seribu ' : terbilangBawahSeribu(ribu) + ' Ribu ');
        nilai %= 1000;
      }
      if (nilai > 0) {
        hasil += terbilangBawahSeribu(nilai) + ' ';
      }

      return (hasil.trim() + ' Rupiah').replace(/\s+/g, ' ');
    }

      var triggerPrint = function () {
        try {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
        } catch (e) {
          console.warn('Iframe print slip failed, fallback to window.print():', e);
          window.print();
        }
      };

      var imgs = doc.images || [];
      if (imgs.length > 0) {
        var loaded = 0;
        var total = imgs.length;
        var done = false;
        var checkFinish = function () {
          if (done) return;
          loaded++;
          if (loaded >= total) {
            done = true;
            setTimeout(triggerPrint, 200);
          }
        };

        for (var i = 0; i < imgs.length; i++) {
          if (imgs[i].complete) {
            checkFinish();
          } else {
            imgs[i].onload = checkFinish;
            imgs[i].onerror = checkFinish;
          }
        }
        setTimeout(function () {
          if (!done) {
            done = true;
            triggerPrint();
          }
        }, 1000);
      } else {
        setTimeout(triggerPrint, 300);
