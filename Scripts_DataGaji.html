<script>
// ==========================================================================
// MODUL PENGELOLAAN DATA GAJI KARYAWAN (OPSI A: 1 NAMA PER BARIS & INPUT HARIAN)
// File: Scripts_DataGaji.html
// Tabel utama menampilkan 1 baris per karyawan dengan total akumulasi berjalan.
// Dilengkapi tombol [+ Input Harian] cepat dan [👁️ Rincian] log harian.
// Mendukung Pengelolaan Periode Payroll Dinamis (Cut-Off Kustom & Tutup Buku).
// ==========================================================================

(function () {
  var cachedDataGajiLogs = [];
  var cachedPeriodeList = [];
  var currentSelectedPeriodId = '';
  var currentActivePeriodInfo = null;
  var isCurrentPeriodClosed = false;
  var currentPageDataGaji = 1;
  var pageSizeDataGaji = 15;
  var bsModalDataGaji = null;
  var bsModalRincianGaji = null;
  var bsModalBukaPeriode = null;
  var currentRincianEmpId = null;

  var NAMA_HARI_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

  function safeFormatDateDMY(dateVal) {
    if (!dateVal || dateVal === '-') return '-';
    if (typeof formatDateDMY === 'function') return formatDateDMY(dateVal);
    try {
      var d = (dateVal instanceof Date) ? dateVal : new Date(dateVal);
      if (isNaN(d.getTime())) return String(dateVal);
      var dd = String(d.getDate()).padStart(2, '0');
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var yyyy = d.getFullYear();
      return dd + '/' + mm + '/' + yyyy;
    } catch (e) {
      return String(dateVal);
    }
  }

  function formatDateWithDay(dateVal) {
    if (!dateVal || dateVal === '-') return '-';
    var dObj = null;
    if (dateVal instanceof Date) {
      dObj = dateVal;
    } else {
      var s = String(dateVal).trim().split('T')[0].split(' ')[0];
      if (s.indexOf('-') !== -1) {
        var p = s.split('-');
        if (p.length === 3) {
          if (p[0].length === 4) {
            dObj = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
          } else {
            dObj = new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
          }
        }
      } else if (s.indexOf('/') !== -1) {
        var p = s.split('/');
        if (p.length === 3) {
          if (p[0].length === 4) {
            dObj = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
          } else {
            dObj = new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
          }
        }
      }
    }
    if (!dObj || isNaN(dObj.getTime())) {
      return safeFormatDateDMY(dateVal);
    }
    var dayName = NAMA_HARI_ID[dObj.getDay()];
    var dd = String(dObj.getDate()).padStart(2, '0');
    var mm = String(dObj.getMonth() + 1).padStart(2, '0');
    var yyyy = dObj.getFullYear();
    return dayName + ', ' + dd + '/' + mm + '/' + yyyy;
  }
  window.formatDateWithDay = formatDateWithDay;

  // Inisialisasi awal saat halaman dibuka
  window.initDataGajiPage = function () {
    populateDataGajiDeptFilters();
    loadDataGajiList();
  };

  function populateDataGajiDeptFilters() {
    var selFilter = document.getElementById('filterDataGajiDept');
    if (!selFilter) return;
    var currentVal = selFilter.value || 'SEMUA';
    selFilter.innerHTML = '<option value="SEMUA">-- Semua Departemen --</option>';

    var depts = [];
    if (Array.isArray(dbDepartemen)) {
      dbDepartemen.forEach(function (d) {
        if (d.name && !depts.includes(d.name)) depts.push(d.name);
      });
    }
    if (Array.isArray(dbKaryawan)) {
      dbKaryawan.forEach(function (k) {
        if (k.dept && !depts.includes(k.dept)) depts.push(k.dept);
      });
    }
    depts.sort();

    depts.forEach(function (d) {
      selFilter.innerHTML += '<option value="' + escapeHTML(d) + '">' + escapeHTML(d) + '</option>';
    });

    selFilter.value = depts.includes(currentVal) ? currentVal : 'SEMUA';
  }

  window.resetDataGajiFilter = function () {
    var selDept = document.getElementById('filterDataGajiDept');
    if (selDept) selDept.value = 'SEMUA';
    var searchEl = document.getElementById('searchDataGaji');
    if (searchEl) searchEl.value = '';
    currentPageDataGaji = 1;
    renderDataGajiTable();
  };

  // --- POPULATE PERIODE SELECTS & CONTROLLERS ---
  function populatePeriodeDropdowns(periods, activePeriod) {
    if (Array.isArray(periods)) {
      cachedPeriodeList = periods;
    }
    if (activePeriod) {
      currentActivePeriodInfo = activePeriod;
    }

    if (!currentSelectedPeriodId) {
      if (currentActivePeriodInfo && currentActivePeriodInfo.id) {
        currentSelectedPeriodId = currentActivePeriodInfo.id;
      } else if (cachedPeriodeList.length > 0) {
        currentSelectedPeriodId = cachedPeriodeList[0].id;
      }
    }

    var selHrd = document.getElementById('selectDataGajiPeriode');
    var selKaryawan = document.getElementById('selectGajiSayaPeriode');

    [selHrd, selKaryawan].forEach(function (sel) {
      if (!sel) return;
      var curVal = sel.value || currentSelectedPeriodId;
      sel.innerHTML = '';
      if (cachedPeriodeList.length === 0) {
        sel.innerHTML = '<option value="">-- Belum Ada Periode --</option>';
        return;
      }
      cachedPeriodeList.forEach(function (p) {
        var opt = document.createElement('option');
        opt.value = p.id;
        var stBadge = p.status === 'TERBUKA' ? '🟢 TERBUKA' : '🔒 DITUTUP';
        var tglRange = (p.startDate ? safeFormatDateDMY(p.startDate) : '-') + ' s/d ' + (p.endDate ? safeFormatDateDMY(p.endDate) : '-');
        opt.text = (p.nama || p.id) + ' (' + tglRange + ') [' + stBadge + ']';
        sel.appendChild(opt);
      });
      if (curVal && cachedPeriodeList.some(function (p) { return p.id === curVal; })) {
        sel.value = curVal;
      } else if (currentSelectedPeriodId) {
        sel.value = currentSelectedPeriodId;
      }
    });

    var targetPeriod = cachedPeriodeList.find(function (p) { return p.id === currentSelectedPeriodId; }) || currentActivePeriodInfo;
    isCurrentPeriodClosed = (targetPeriod && targetPeriod.status === 'DITUTUP');

    // HRD Status & Cut-Off
    var badgeHrd = document.getElementById('badgeDataGajiStatusPeriode');
    var cutOffHrd = document.getElementById('textDataGajiCutOffRange');
    var btnTutup = document.getElementById('btnTutupBukuPayroll');

    if (badgeHrd) {
      if (isCurrentPeriodClosed) {
        badgeHrd.className = 'badge bg-danger-subtle text-danger border border-danger-subtle extra-small fw-semibold';
        badgeHrd.innerHTML = '<i class="bi bi-lock-fill me-1"></i>BUKU DITUTUP';
      } else {
        badgeHrd.className = 'badge bg-success-subtle text-success border border-success-subtle extra-small fw-semibold';
        badgeHrd.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>BUKU TERBUKA';
      }
    }
    if (cutOffHrd && targetPeriod) {
      var sDate = targetPeriod.startDate ? safeFormatDateDMY(targetPeriod.startDate) : '-';
      var eDate = targetPeriod.endDate ? safeFormatDateDMY(targetPeriod.endDate) : '-';
      cutOffHrd.innerHTML = '<i class="bi bi-clock-history me-1"></i>Cut-off: <strong>' + sDate + '</strong> s/d <strong>' + eDate + '</strong>';
    }
    if (btnTutup) {
      if (isCurrentPeriodClosed) {
        btnTutup.disabled = true;
        btnTutup.classList.add('opacity-50');
        btnTutup.title = 'Periode ini sudah dalam status Ditutup Buku';
      } else {
        btnTutup.disabled = false;
        btnTutup.classList.remove('opacity-50');
        btnTutup.title = 'Tutup buku periode yang sedang aktif';
      }
    }

    // Karyawan Status & Cut-Off
    var badgeKaryawan = document.getElementById('badgeGajiSayaStatusPeriode');
    var cutOffKaryawan = document.getElementById('textGajiSayaCutOffRange');
    if (badgeKaryawan) {
      if (isCurrentPeriodClosed) {
        badgeKaryawan.className = 'badge bg-danger-subtle text-danger border border-danger-subtle extra-small fw-semibold';
        badgeKaryawan.innerHTML = '<i class="bi bi-lock-fill me-1"></i>BUKU DITUTUP';
      } else {
        badgeKaryawan.className = 'badge bg-success-subtle text-success border border-success-subtle extra-small fw-semibold';
        badgeKaryawan.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>BUKU TERBUKA';
      }
    }
    if (cutOffKaryawan && targetPeriod) {
      var sDate = targetPeriod.startDate ? safeFormatDateDMY(targetPeriod.startDate) : '-';
      var eDate = targetPeriod.endDate ? safeFormatDateDMY(targetPeriod.endDate) : '-';
      cutOffKaryawan.innerHTML = '<i class="bi bi-clock-history me-1"></i>Rentang Cut-Off: <strong>' + sDate + '</strong> s/d <strong>' + eDate + '</strong>';
    }
  }
  window.populatePeriodeDropdowns = populatePeriodeDropdowns;

  // On Change Period Handlers
  window.onDataGajiPeriodeChange = function () {
    var sel = document.getElementById('selectDataGajiPeriode');
    if (sel && sel.value) {
      currentSelectedPeriodId = sel.value;
      loadDataGajiList();
    }
  };

  window.onGajiSayaPeriodeChange = function () {
    var sel = document.getElementById('selectGajiSayaPeriode');
    if (sel && sel.value) {
      currentSelectedPeriodId = sel.value;
      initGajiSayaPage();
    }
  };

  // --- LOAD DATA GAJI LIST ---
  window.loadDataGajiList = function () {
    var tbody = document.getElementById('tableBodyDataGaji');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data gaji karyawan...</td></tr>';
    }

    // Pastikan dbKaryawan dan dbDepartemen terisi jika belum ada
    if (!Array.isArray(dbKaryawan) || dbKaryawan.length === 0) {
      gasRun('getInitialData', Auth.getToken()).then(function (initRes) {
        if (initRes && initRes.success) {
          if (Array.isArray(initRes.karyawan)) dbKaryawan = initRes.karyawan;
          if (Array.isArray(initRes.departemen)) dbDepartemen = initRes.departemen;
          populateDataGajiDeptFilters();
        }
      }).catch(function (e) { console.warn('Fetch initial data error:', e); });
    }

    gasRun('getDataGaji', Auth.getToken(), null, null, currentSelectedPeriodId).then(function (res) {
      if (handleSessionExpired(res)) return;

      if (res && res.success) {
        cachedDataGajiLogs = Array.isArray(res.list) ? res.list : [];
        if (Array.isArray(res.periods)) cachedPeriodeList = res.periods;
        if (res.period) {
          currentActivePeriodInfo = res.period;
          if (!currentSelectedPeriodId) currentSelectedPeriodId = res.period.id;
        }
        populatePeriodeDropdowns(res.periods, res.period);
        renderDataGajiTable();

        // Jika modal rincian sedang terbuka, segarkan tampilannya juga
        if (currentRincianEmpId && bsModalRincianGaji) {
          renderRincianModal(currentRincianEmpId);
        }
      } else {
        if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="text-center text-danger py-4">' + escapeHTML(res.message || 'Gagal memuat data gaji.') + '</td></tr>';
      }
    }).catch(function (err) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="text-center text-danger py-4">Gagal memuat data: ' + escapeHTML(err.toString()) + '</td></tr>';
    });
  };

  function matchLogToEmp(log, emp) {
    if (!log || !emp) return false;
    var logId = String(log.empId || '').trim().toLowerCase();
    var empId = String(emp.id || '').trim().toLowerCase();
    if (logId && empId && logId === empId) return true;

    // Nomor digit saja (misal BBB-260620 dengan 260620)
    var numLog = logId.replace(/\D/g, '');
    var numEmp = empId.replace(/\D/g, '');
    if (numLog && numEmp && numLog === numEmp) return true;

    // Nama karyawan
    var logName = String(log.empName || '').trim().toLowerCase();
    var empName = String(emp.name || '').trim().toLowerCase();
    if (logName && empName && logName === empName) return true;

    return false;
  }

  // --- RENDER TABEL UTAMA (1 BARIS PER KARYAWAN) ---
  window.renderDataGajiTable = function () {
    var tbody = document.getElementById('tableBodyDataGaji');
    if (!tbody) return;
    tbody.innerHTML = '';

    var selDept = document.getElementById('filterDataGajiDept');
    var filterDept = selDept ? selDept.value : 'SEMUA';

    var search = (document.getElementById('searchDataGaji') ? document.getElementById('searchDataGaji').value : '').toLowerCase().trim();

    // 1. Petakan setiap karyawan di dbKaryawan dan hitung akumulasi log hariannya
    var matchedLogIds = new Set();
    var empList = (Array.isArray(dbKaryawan) ? dbKaryawan : []).map(function (k) {
      var kLogs = cachedDataGajiLogs.filter(function (log) {
        var match = matchLogToEmp(log, k);
        if (match && log.id) matchedLogIds.add(log.id);
        return match;
      });

      var totalJamOt = 0;
      var totalNominalOt = 0;
      var totalRitase = 0;
      var totalNominalRit = 0;
      var totalTunjangan = 0;

      kLogs.forEach(function (log) {
        totalJamOt += Number(log.jamOvertime || 0);
        totalNominalOt += Number(log.totalOvertime || 0);
        totalRitase += Number(log.ritase || 0);
        totalNominalRit += Number(log.totalRitase || 0);
        totalTunjangan += Number(log.tunjanganHarian || 0);
      });

      var basic = Number(k.gajiPokok || 0);
      var grandTotal = basic + totalNominalOt + totalNominalRit + totalTunjangan;

      return {
        id: k.id,
        name: k.name,
        dept: k.dept || '-',
        jabatan: k.jabatan || '-',
        basic: basic,
        daysCount: kLogs.length,
        totalJamOt: totalJamOt,
        totalNominalOt: totalNominalOt,
        totalRitase: totalRitase,
        totalNominalRit: totalNominalRit,
        totalTunjangan: totalTunjangan,
        grandTotal: grandTotal,
        logs: kLogs
      };
    });

    // 2. Jika ada log di database yang tidak terhubung ke karyawan di dbKaryawan, buatkan barisnya otomatis!
    var unmappedLogs = cachedDataGajiLogs.filter(function (l) { return l.id && !matchedLogIds.has(l.id); });
    var groupedUnmapped = {};
    unmappedLogs.forEach(function (log) {
      var key = String(log.empId || log.empName || 'UNKNOWN').trim().toLowerCase();
      if (!groupedUnmapped[key]) {
        groupedUnmapped[key] = {
          id: log.empId || key,
          name: log.empName || log.empId || 'Karyawan',
          dept: log.dept || '-',
          jabatan: log.jabatan || '-',
          basic: Number(log.basic || 0),
          logs: []
        };
      }
      groupedUnmapped[key].logs.push(log);
    });

    Object.keys(groupedUnmapped).forEach(function (kKey) {
      var g = groupedUnmapped[kKey];
      var totalJamOt = 0, totalNominalOt = 0, totalRitase = 0, totalNominalRit = 0, totalTunjangan = 0;
      g.logs.forEach(function (log) {
        totalJamOt += Number(log.jamOvertime || 0);
        totalNominalOt += Number(log.totalOvertime || 0);
        totalRitase += Number(log.ritase || 0);
        totalNominalRit += Number(log.totalRitase || 0);
        totalTunjangan += Number(log.tunjanganHarian || 0);
      });
      var basic = Number(g.basic || 0);
      empList.push({
        id: g.id,
        name: g.name,
        dept: g.dept,
        jabatan: g.jabatan,
        basic: basic,
        daysCount: g.logs.length,
        totalJamOt: totalJamOt,
        totalNominalOt: totalNominalOt,
        totalRitase: totalRitase,
        totalNominalRit: totalNominalRit,
        totalTunjangan: totalTunjangan,
        grandTotal: basic + totalNominalOt + totalNominalRit + totalTunjangan,
        logs: g.logs
      });
    });

    // 3. Urutkan: Karyawan yang memiliki data entri harian (daysCount > 0) tampil paling atas!
    empList.sort(function (a, b) {
      if (b.daysCount !== a.daysCount) {
        return b.daysCount - a.daysCount;
      }
      return String(a.name || '').localeCompare(String(b.name || ''));
    });

    // Terapkan Filter Departemen & Pencarian
    var filtered = empList.filter(function (emp) {
      if (filterDept && filterDept !== 'SEMUA') {
        if (String(emp.dept || '').toLowerCase() !== filterDept.toLowerCase()) return false;
      }
      if (search) {
        var match = emp.name.toLowerCase().includes(search) ||
          emp.id.toLowerCase().includes(search) ||
          emp.dept.toLowerCase().includes(search) ||
          emp.jabatan.toLowerCase().includes(search);
        if (!match) return false;
      }
      return true;
    });

    var badgeCount = document.getElementById('badgeCountDataGaji');
    if (badgeCount) badgeCount.innerText = filtered.length + ' Karyawan';

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">Tidak ada data karyawan yang sesuai filter.</td></tr>';
      renderPaginationControls('paginationDataGaji', 0, 1, function () { });
      return;
    }

    var startIdx = (currentPageDataGaji - 1) * pageSizeDataGaji;
    var pageData = filtered.slice(startIdx, startIdx + pageSizeDataGaji);

    pageData.forEach(function (emp, idx) {
      var no = startIdx + idx + 1;

      var otText = emp.totalJamOt > 0 || emp.totalNominalOt > 0
        ? '<div class="text-end"><span class="fw-semibold text-primary">' + formatRupiahVal(emp.totalNominalOt) + '</span><br><small class="text-muted extra-small">' + emp.totalJamOt + ' Jam</small></div>'
        : '<span class="text-muted extra-small">-</span>';

      var ritText = emp.totalRitase > 0 || emp.totalNominalRit > 0
        ? '<div class="text-end"><span class="fw-semibold text-warning">' + formatRupiahVal(emp.totalNominalRit) + '</span><br><small class="text-muted extra-small">' + emp.totalRitase + ' Rit</small></div>'
        : '<span class="text-muted extra-small">-</span>';

      var tunjText = emp.totalTunjangan > 0
        ? '<div class="text-end fw-semibold text-dark">' + formatRupiahVal(emp.totalTunjangan) + '</div>'
        : '<span class="text-muted extra-small">-</span>';

      var actionBtnHtml = isCurrentPeriodClosed
        ? '<button class="btn btn-sm btn-secondary py-1 px-2.5 fw-semibold disabled" disabled title="Periode ini sudah ditutup buku (Terkunci)"><i class="bi bi-lock me-1"></i>Terkunci</button>'
        : '<button class="btn btn-sm btn-primary py-1 px-2.5 fw-semibold" onclick="openInputForEmp(\'' + escapeHTML(emp.id) + '\')" title="Input Harian untuk Karyawan Ini"><i class="bi bi-plus-lg me-1"></i>Input Harian</button>';

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="text-center text-muted extra-small">' + no + '</td>' +
        '<td><strong>' + escapeHTML(emp.name) + '</strong><br><small class="text-muted extra-small">ID: ' + escapeHTML(emp.id) + '</small></td>' +
        '<td><span class="badge bg-light text-dark border">' + escapeHTML(emp.dept) + '</span><br><small class="text-muted extra-small">' + escapeHTML(emp.jabatan) + '</small></td>' +
        '<td class="text-end fw-semibold text-dark">' + formatRupiahVal(emp.basic) + '</td>' +
        '<td class="text-end">' + otText + '</td>' +
        '<td class="text-end">' + ritText + '</td>' +
        '<td class="text-end">' + tunjText + '</td>' +
        '<td class="text-end"><span class="badge bg-success text-white px-2.5 py-1.5" style="font-size: 0.875rem; font-weight: 700; box-shadow: 0 1px 2px rgba(16,185,129,0.25);">' + formatRupiahVal(emp.grandTotal) + '</span></td>' +
        '<td class="text-center"><span class="badge ' + (emp.daysCount > 0 ? 'bg-primary-subtle text-primary border border-primary-subtle' : 'bg-light text-muted border') + ' fw-semibold">' + emp.daysCount + ' Hari</span></td>' +
        '<td class="text-center text-nowrap">' +
        '  <div class="action-group">' +
        actionBtnHtml +
        '    <button class="btn btn-sm btn-outline-info py-1 px-2.5 ms-1" onclick="openRincianEmp(\'' + escapeHTML(emp.id) + '\')" title="Lihat Rincian Riwayat Harian"><i class="bi bi-eye me-1"></i>Rincian</button>' +
        '    <button class="btn btn-sm btn-outline-danger py-1 px-2.5 ms-1" onclick="printRincianGajiEmp(\'' + escapeHTML(emp.id) + '\')" title="Cetak / Simpan PDF Laporan Rincian"><i class="bi bi-printer me-1"></i>PDF</button>' +
        '  </div>' +
        '</td>';

      tbody.appendChild(tr);
    });

    renderPaginationControls('paginationDataGaji', filtered.length, currentPageDataGaji, function (newPage) {
      currentPageDataGaji = newPage;
      renderDataGajiTable();
    });
  };

  // --- MODAL 1: INPUT GAJI HARIAN ---
  window.openInputForEmp = function (empId) {
    var emp = (dbKaryawan || []).find(function (k) { return String(k.id).toLowerCase() === String(empId).toLowerCase(); });
    if (!emp) return;
    openModalDataGaji(null, emp);
  };

  window.openModalDataGaji = function (gajiId, preSelectedEmp) {
    if (isCurrentPeriodClosed) {
      Swal.fire({
        icon: 'warning',
        title: 'Periode Ditutup Buku',
        text: 'Periode payroll ini sudah dalam status DITUTUP. Data gaji tidak dapat ditambah atau diubah.',
        confirmButtonColor: '#2563eb'
      });
      return;
    }

    var modalEl = document.getElementById('modalDataGaji');
    if (!modalEl) return;
    if (!bsModalDataGaji) {
      bsModalDataGaji = new bootstrap.Modal(modalEl);
    }

    var titleEl = document.getElementById('modalDataGajiTitle');
    var formEl = document.getElementById('formModalDataGaji');
    if (formEl) formEl.reset();

    // Set hidden period ID
    var pIdHidden = document.getElementById('gajiPeriodIdHidden');
    if (pIdHidden) pIdHidden.value = currentSelectedPeriodId || (currentActivePeriodInfo ? currentActivePeriodInfo.id : '');

    // Populate Department dropdown in Modal
    populateModalDeptSelect();

    // Setup rupiah masks on money inputs
    setupRupiahMask(document.getElementById('gajiTarifOvertime'));
    setupRupiahMask(document.getElementById('gajiTarifRitase'));
    setupRupiahMask(document.getElementById('gajiTunjanganHarian'));

    if (gajiId) {
      var item = cachedDataGajiLogs.find(function (g) { return g.id === gajiId; });
      if (!item) return;

      if (titleEl) titleEl.innerHTML = '<i class="bi bi-pencil-square me-2"></i>Edit Data Gaji Harian';
      document.getElementById('gajiEditId').value = item.id;
      document.getElementById('gajiTanggal').value = item.tanggal || '';

      var deptSel = document.getElementById('gajiDeptSelect');
      if (deptSel) deptSel.value = item.dept || '';

      populateModalEmpSelect(item.dept, item.empId);

      document.getElementById('gajiEmpIdHidden').value = item.empId || '';
      document.getElementById('gajiEmpNameHidden').value = item.empName || '';
      document.getElementById('gajiEmpIdDisplay').value = item.empId || '';
      document.getElementById('gajiJabatanDisplay').value = item.jabatan || '';

      var empMatch = dbKaryawan.find(function (k) { return String(k.id).toLowerCase() === String(item.empId).toLowerCase(); });
      var empBasic = empMatch && empMatch.gajiPokok ? empMatch.gajiPokok : (item.basic || 0);
      document.getElementById('gajiBasicNumeric').value = empBasic;
      document.getElementById('gajiBasicDisplay').value = formatRupiahVal(empBasic);

      document.getElementById('gajiJamOvertime').value = item.jamOvertime || '';
      document.getElementById('gajiTarifOvertime').value = item.tarifOvertime ? formatRupiahVal(item.tarifOvertime).replace('Rp ', '') : '';
      document.getElementById('gajiRitase').value = item.ritase || '';
      document.getElementById('gajiTarifRitase').value = item.tarifRitase ? formatRupiahVal(item.tarifRitase).replace('Rp ', '') : '';
      document.getElementById('gajiTunjanganHarian').value = item.tunjanganHarian ? formatRupiahVal(item.tunjanganHarian).replace('Rp ', '') : '';
      document.getElementById('gajiCatatan').value = item.catatan || '';
    } else {
      document.getElementById('gajiEditId').value = '';

      var today = new Date();
      var todayStr = today.toISOString().split('T')[0];
      var tglInput = document.getElementById('gajiTanggal');
      if (tglInput) tglInput.value = todayStr;

      if (preSelectedEmp) {
        if (titleEl) titleEl.innerHTML = '<i class="bi bi-wallet-fill me-2"></i>Input Gaji Harian - ' + escapeHTML(preSelectedEmp.name);

        var deptSelectEl = document.getElementById('gajiDeptSelect');
        if (deptSelectEl) deptSelectEl.value = preSelectedEmp.dept || '';

        populateModalEmpSelect(preSelectedEmp.dept, preSelectedEmp.id);

        document.getElementById('gajiEmpIdHidden').value = preSelectedEmp.id;
        document.getElementById('gajiEmpNameHidden').value = preSelectedEmp.name;
        document.getElementById('gajiEmpIdDisplay').value = preSelectedEmp.id;
        document.getElementById('gajiJabatanDisplay').value = preSelectedEmp.jabatan || '-';

        var bVal = Number(preSelectedEmp.gajiPokok) || 0;
        document.getElementById('gajiBasicNumeric').value = bVal;
        document.getElementById('gajiBasicDisplay').value = formatRupiahVal(bVal);
      } else {
        if (titleEl) titleEl.innerHTML = '<i class="bi bi-wallet-fill me-2"></i>Tambah Data Gaji';
        document.getElementById('gajiEmpIdHidden').value = '';
        document.getElementById('gajiEmpNameHidden').value = '';
        document.getElementById('gajiEmpIdDisplay').value = '';
        document.getElementById('gajiJabatanDisplay').value = '';
        document.getElementById('gajiBasicDisplay').value = 'Rp 0';
        document.getElementById('gajiBasicNumeric').value = '0';

        var empSel = document.getElementById('gajiEmpSelect');
        if (empSel) {
          empSel.innerHTML = '<option value="">-- Pilih Departemen Terlebih Dahulu --</option>';
          empSel.disabled = true;
        }
      }
    }

    calculateTotalGajiLive();
    bsModalDataGaji.show();
  };

  function populateModalDeptSelect(selectedDept) {
    var sel = document.getElementById('gajiDeptSelect');
    if (!sel) return;
    sel.innerHTML = '<option value="">-- Pilih Departemen --</option>';

    var depts = [];
    if (Array.isArray(dbDepartemen)) {
      dbDepartemen.forEach(function (d) {
        if (d.name && !depts.includes(d.name)) depts.push(d.name);
      });
    }
    if (Array.isArray(dbKaryawan)) {
      dbKaryawan.forEach(function (k) {
        if (k.dept && !depts.includes(k.dept)) depts.push(k.dept);
      });
    }
    depts.sort();

    depts.forEach(function (d) {
      sel.innerHTML += '<option value="' + escapeHTML(d) + '">' + escapeHTML(d) + '</option>';
    });

    if (selectedDept) sel.value = selectedDept;
  }

  function populateModalEmpSelect(deptName, selectedEmpId) {
    var sel = document.getElementById('gajiEmpSelect');
    if (!sel) return;
    if (!deptName) {
      sel.innerHTML = '<option value="">-- Pilih Departemen Terlebih Dahulu --</option>';
      sel.disabled = true;
      return;
    }

    var filtered = (dbKaryawan || []).filter(function (k) {
      return String(k.dept || '').trim().toLowerCase() === String(deptName).trim().toLowerCase();
    });

    if (filtered.length === 0) {
      sel.innerHTML = '<option value="">-- Tidak ada karyawan di departemen ini --</option>';
      sel.disabled = true;
      return;
    }

    sel.disabled = false;
    sel.innerHTML = '<option value="">-- Pilih Karyawan (' + filtered.length + ' Orang) --</option>';

    filtered.forEach(function (k) {
      var isSel = selectedEmpId && String(k.id).toLowerCase() === String(selectedEmpId).toLowerCase();
      sel.innerHTML += '<option value="' + escapeHTML(k.id) + '"' + (isSel ? ' selected' : '') + '>' + escapeHTML(k.name) + ' (' + escapeHTML(k.id) + ')</option>';
    });

    if (selectedEmpId) sel.value = selectedEmpId;
  }

  window.onDataGajiDeptChange = function () {
    var deptSel = document.getElementById('gajiDeptSelect');
    var selectedDept = deptSel ? deptSel.value : '';

    populateModalEmpSelect(selectedDept);

    document.getElementById('gajiEmpIdHidden').value = '';
    document.getElementById('gajiEmpNameHidden').value = '';
    document.getElementById('gajiEmpIdDisplay').value = '';
    document.getElementById('gajiJabatanDisplay').value = '';
    document.getElementById('gajiBasicDisplay').value = 'Rp 0';
    document.getElementById('gajiBasicNumeric').value = '0';

    calculateTotalGajiLive();
  };

  window.onDataGajiEmpChange = function () {
    var empSel = document.getElementById('gajiEmpSelect');
    var selectedEmpId = empSel ? empSel.value : '';
    if (!selectedEmpId) {
      document.getElementById('gajiEmpIdHidden').value = '';
      document.getElementById('gajiEmpNameHidden').value = '';
      document.getElementById('gajiEmpIdDisplay').value = '';
      document.getElementById('gajiJabatanDisplay').value = '';
      document.getElementById('gajiBasicDisplay').value = 'Rp 0';
      document.getElementById('gajiBasicNumeric').value = '0';
      calculateTotalGajiLive();
      return;
    }

    var emp = (dbKaryawan || []).find(function (k) {
      return String(k.id).toLowerCase() === String(selectedEmpId).toLowerCase();
    });

    if (emp) {
      document.getElementById('gajiEmpIdHidden').value = emp.id;
      document.getElementById('gajiEmpNameHidden').value = emp.name;
      document.getElementById('gajiEmpIdDisplay').value = emp.id;
      document.getElementById('gajiJabatanDisplay').value = emp.jabatan || '-';

      var basicVal = Number(emp.gajiPokok) || 0;
      document.getElementById('gajiBasicNumeric').value = basicVal;
      document.getElementById('gajiBasicDisplay').value = formatRupiahVal(basicVal);
    }

    calculateTotalGajiLive();
  };

  // --- LIVE CALCULATION IN MODAL ---
  window.calculateTotalGajiLive = function () {
    var basic = Number(document.getElementById('gajiBasicNumeric').value) || 0;

    var jamOt = parseFloat(document.getElementById('gajiJamOvertime').value) || 0;
    var tarifOt = parseRupiahVal(document.getElementById('gajiTarifOvertime').value);
    var subtotalOt = Math.round(jamOt * tarifOt);

    var ritase = parseFloat(document.getElementById('gajiRitase').value) || 0;
    var tarifRit = parseRupiahVal(document.getElementById('gajiTarifRitase').value);
    var subtotalRit = Math.round(ritase * tarifRit);

    var tunjangan = parseRupiahVal(document.getElementById('gajiTunjanganHarian').value);

    // Total Gaji Live Preview = Basic + Overtime + Ritase + Tunjangan
    var grandTotalGaji = basic + subtotalOt + subtotalRit + tunjangan;

    var pillOt = document.getElementById('previewSubtotalOvertime');
    if (pillOt) pillOt.innerText = formatRupiahVal(subtotalOt);

    var pillRit = document.getElementById('previewSubtotalRitase');
    if (pillRit) pillRit.innerText = formatRupiahVal(subtotalRit);

    var sumBasic = document.getElementById('liveSumBasic');
    if (sumBasic) sumBasic.innerText = formatRupiahVal(basic);

    var sumOt = document.getElementById('liveSumOvertime');
    if (sumOt) sumOt.innerText = formatRupiahVal(subtotalOt);

    var sumRit = document.getElementById('liveSumRitase');
    if (sumRit) sumRit.innerText = formatRupiahVal(subtotalRit);

    var sumTunj = document.getElementById('liveSumTunjangan');
    if (sumTunj) sumTunj.innerText = formatRupiahVal(tunjangan);

    var sumTotal = document.getElementById('liveSumTotalGaji');
    if (sumTotal) sumTotal.innerText = formatRupiahVal(grandTotalGaji);
  };

  // --- SUBMIT FORM ---
  window.submitDataGaji = function (e) {
    if (e && e.preventDefault) e.preventDefault();

    if (isCurrentPeriodClosed) {
      Swal.fire('Periode Ditutup Buku', 'Periode payroll ini sudah ditutup. Data tidak dapat disimpan.', 'warning');
      return;
    }

    var editId = document.getElementById('gajiEditId').value.trim();
    var periodIdVal = document.getElementById('gajiPeriodIdHidden') ? document.getElementById('gajiPeriodIdHidden').value.trim() : '';
    if (!periodIdVal) periodIdVal = currentSelectedPeriodId || (currentActivePeriodInfo ? currentActivePeriodInfo.id : '');

    var tanggal = document.getElementById('gajiTanggal').value.trim();
    var dept = document.getElementById('gajiDeptSelect').value.trim();
    var empId = document.getElementById('gajiEmpIdHidden').value.trim() || document.getElementById('gajiEmpSelect').value.trim();
    var empName = document.getElementById('gajiEmpNameHidden').value.trim();
    var jabatan = document.getElementById('gajiJabatanDisplay').value.trim();
    var basic = Number(document.getElementById('gajiBasicNumeric').value) || 0;

    if (!tanggal) {
      showFormValidationWarning('gajiTanggal', 'Tanggal kerja wajib diisi.');
      return;
    }
    if (!dept) {
      showFormValidationWarning('gajiDeptSelect', 'Departemen wajib dipilih.');
      return;
    }
    if (!empId) {
      showFormValidationWarning('gajiEmpSelect', 'Nama Karyawan wajib dipilih.');
      return;
    }

    var jamOt = parseFloat(document.getElementById('gajiJamOvertime').value) || 0;
    var tarifOt = parseRupiahVal(document.getElementById('gajiTarifOvertime').value);
    var ritase = parseFloat(document.getElementById('gajiRitase').value) || 0;
    var tarifRit = parseRupiahVal(document.getElementById('gajiTarifRitase').value);
    var tunjangan = parseRupiahVal(document.getElementById('gajiTunjanganHarian').value);
    var catatan = document.getElementById('gajiCatatan').value.trim();

    var subtotalOt = jamOt * tarifOt;
    var subtotalRit = ritase * tarifRit;
    var totalHariIni = subtotalOt + subtotalRit + tunjangan;

    var payload = {
      id: editId,
      periodId: periodIdVal,
      tanggal: tanggal,
      dept: dept,
      empId: empId,
      empName: empName,
      jabatan: jabatan,
      basic: basic,
      jamOvertime: jamOt,
      tarifOvertime: tarifOt,
      ritase: ritase,
      tarifRitase: tarifRit,
      tunjanganHarian: tunjangan,
      catatan: catatan
    };

    var confirmHtml =
      '<div class="text-start extra-small p-2.5 rounded bg-light border mb-2">' +
      '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Tanggal Kerja:</span><strong class="text-dark">' + escapeHTML(formatDateWithDay(tanggal)) + '</strong></div>' +
      '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Karyawan:</span><strong class="text-dark">' + escapeHTML(empName) + ' (' + escapeHTML(empId) + ')</strong></div>' +
      '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Gaji Pokok (Basic):</span><strong>' + formatRupiahVal(basic) + '</strong></div>' +
      '<hr class="my-1">' +
      '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Overtime Hari Ini:</span><span>' + jamOt + ' Jam @ ' + formatRupiahVal(tarifOt) + ' = <strong>' + formatRupiahVal(subtotalOt) + '</strong></span></div>' +
      '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Ritase Hari Ini:</span><span>' + ritase + ' Rit @ ' + formatRupiahVal(tarifRit) + ' = <strong>' + formatRupiahVal(subtotalRit) + '</strong></span></div>' +
      '<div class="d-flex justify-content-between mb-1"><span class="text-muted">Tunjangan Hari Ini:</span><strong>' + formatRupiahVal(tunjangan) + '</strong></div>' +
      '<hr class="my-1">' +
      '<div class="d-flex justify-content-between fs-6"><span class="fw-bold text-dark">Penghasilan Hari Ini:</span><strong class="text-success">' + formatRupiahVal(totalHariIni) + '</strong></div>' +
      '</div>';

    Swal.fire({
      title: editId ? 'Perbarui Data Gaji?' : 'Simpan Data Gaji Harian?',
      html: confirmHtml,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: '<i class="bi bi-save me-1"></i>Ya, Simpan',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#2563eb'
    }).then(function (res) {
      if (!res.isConfirmed) return;

      showFullPageLoading('Menyimpan data gaji...');

      gasRun('saveDataGaji', Auth.getToken(), payload).then(function (resp) {
        hideFullPageLoading();
        if (handleSessionExpired(resp)) return;

        if (resp && resp.success) {
          if (bsModalDataGaji) bsModalDataGaji.hide();
          Swal.fire({
            icon: 'success',
            title: 'Berhasil Disimpan',
            text: resp.message || 'Data gaji berhasil disimpan.',
            timer: 2000,
            showConfirmButton: false
          });

          // Langsung tambahkan atau perbarui item di memori agar perubahan seketika tampil di UI
          if (resp.item) {
            var existingIdx = cachedDataGajiLogs.findIndex(function (l) { return l.id === resp.item.id; });
            if (existingIdx !== -1) {
              cachedDataGajiLogs[existingIdx] = resp.item;
            } else {
              cachedDataGajiLogs.unshift(resp.item);
            }
            renderDataGajiTable();
            if (currentRincianEmpId && bsModalRincianGaji) {
              renderRincianModal(currentRincianEmpId);
            }
          }

          loadDataGajiList();
        } else {
          Swal.fire('Gagal Menyimpan', (resp && resp.message) || 'Terjadi kesalahan sistem.', 'error');
        }
      }).catch(function (err) {
        hideFullPageLoading();
        Swal.fire('Error', err.toString(), 'error');
      });
    });
  };

  // --- MODAL 2: RINCIAN RIWAYAT GAJI KARYAWAN ---
  window.openRincianEmp = function (empId) {
    currentRincianEmpId = empId;
    var modalEl = document.getElementById('modalRincianGaji');
    if (!modalEl) return;
    if (!bsModalRincianGaji) {
      bsModalRincianGaji = new bootstrap.Modal(modalEl);
    }

    renderRincianModal(empId);
    bsModalRincianGaji.show();
  };

  function renderRincianModal(empId) {
    var emp = (dbKaryawan || []).find(function (k) { return matchLogToEmp({ empId: empId, empName: empId }, k); });
    if (!emp) {
      var sampleLog = cachedDataGajiLogs.find(function (l) {
        return matchLogToEmp(l, { id: empId, name: empId });
      });
      if (sampleLog) {
        emp = {
          id: sampleLog.empId || empId,
          name: sampleLog.empName || empId,
          dept: sampleLog.dept || '-',
          jabatan: sampleLog.jabatan || '-',
          gajiPokok: sampleLog.basic || 0
        };
      } else {
        emp = {
          id: empId,
          name: empId,
          dept: '-',
          jabatan: '-',
          gajiPokok: 0
        };
      }
    }

    var titleEl = document.getElementById('rincianEmpTitle');
    if (titleEl) {
      titleEl.innerText = emp.name + ' (' + emp.id + ')';
      titleEl.className = 'text-white fw-bold';
      titleEl.style.color = '#ffffff';
    }

    var deptJabatanEl = document.getElementById('rincianEmpDeptJabatan');
    if (deptJabatanEl) deptJabatanEl.innerText = (emp.dept || '-') + ' / ' + (emp.jabatan || '-');

    var basicVal = Number(emp.gajiPokok) || 0;
    var basicEl = document.getElementById('rincianEmpBasic');
    if (basicEl) basicEl.innerText = formatRupiahVal(basicVal);

    // Ambil semua log karyawan ini dengan pencocokan fleksibel
    var kLogs = cachedDataGajiLogs.filter(function (log) {
      return matchLogToEmp(log, emp);
    });

    var totalJamOt = 0;
    var totalNominalOt = 0;
    var totalRitase = 0;
    var totalNominalRit = 0;
    var totalTunjangan = 0;

    kLogs.forEach(function (log) {
      totalJamOt += Number(log.jamOvertime || 0);
      totalNominalOt += Number(log.totalOvertime || 0);
      totalRitase += Number(log.ritase || 0);
      totalNominalRit += Number(log.totalRitase || 0);
      totalTunjangan += Number(log.tunjanganHarian || 0);
    });

    var grandTotal = basicVal + totalNominalOt + totalNominalRit + totalTunjangan;

    var otEl = document.getElementById('rincianEmpOvertime');
    if (otEl) otEl.innerText = totalJamOt + ' Jam / ' + formatRupiahVal(totalNominalOt);

    var ritEl = document.getElementById('rincianEmpRitase');
    if (ritEl) ritEl.innerText = totalRitase + ' Rit / ' + formatRupiahVal(totalNominalRit);

    var grandTotalEl = document.getElementById('rincianEmpGrandTotal');
    if (grandTotalEl) grandTotalEl.innerText = formatRupiahVal(grandTotal);

    var countBadge = document.getElementById('rincianLogCount');
    if (countBadge) countBadge.innerText = kLogs.length + ' Hari Kerja';

    // Kontrol tombol "+ Input Harian Baru" di dalam modal rincian jika periode ditutup
    var btnAddRincian = document.getElementById('btnRincianAddToday');
    if (btnAddRincian) {
      btnAddRincian.style.display = isCurrentPeriodClosed ? 'none' : 'inline-block';
    }

    // Render Tabel Log
    var tbody = document.getElementById('tableBodyRincianLog');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (kLogs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Belum ada catatan log kerja harian untuk karyawan ini. ' +
        (isCurrentPeriodClosed ? '<span class="text-danger fw-semibold">(Periode Ditutup Buku)</span>' : 'Klik tombol "+ Input Harian Baru" untuk menambahkan.') + '</td></tr>';
      return;
    }

    kLogs.forEach(function (log, idx) {
      var subOt = Number(log.totalOvertime || 0);
      var subRit = Number(log.totalRitase || 0);
      var tunj = Number(log.tunjanganHarian || 0);
      var totalHariItu = subOt + subRit + tunj;

      var otStr = log.jamOvertime > 0
        ? '<span class="fw-semibold text-primary">' + formatRupiahVal(subOt) + '</span><br><small class="text-muted extra-small">' + log.jamOvertime + ' Jam</small>'
        : '<span class="text-muted extra-small">-</span>';

      var ritStr = log.ritase > 0
        ? '<span class="fw-semibold text-warning">' + formatRupiahVal(subRit) + '</span><br><small class="text-muted extra-small">' + log.ritase + ' Rit</small>'
        : '<span class="text-muted extra-small">-</span>';

      var actionRowHtml = isCurrentPeriodClosed
        ? '<span class="badge bg-light text-muted border extra-small"><i class="bi bi-lock me-1"></i>Terkunci</span>'
        : '  <div class="action-group">' +
          '    <button class="btn btn-sm btn-action btn-action-edit" onclick="editLogFromRincian(\'' + escapeHTML(log.id) + '\')" title="Edit"><i class="bi bi-pencil-square"></i>Edit</button>' +
          '    <button class="btn btn-sm btn-action btn-action-delete" onclick="deleteLogFromRincian(\'' + escapeHTML(log.id) + '\', \'' + escapeHTML(log.tanggal) + '\')" title="Hapus"><i class="bi bi-trash"></i>Hapus</button>' +
          '  </div>';

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="text-center text-muted extra-small text-nowrap">' + (idx + 1) + '</td>' +
        '<td class="fw-bold text-nowrap"><i class="bi bi-calendar-event me-1 text-primary"></i>' + escapeHTML(formatDateWithDay(log.tanggal)) + '</td>' +
        '<td class="text-end text-nowrap">' + otStr + '</td>' +
        '<td class="text-end text-nowrap">' + ritStr + '</td>' +
        '<td class="text-end fw-semibold text-nowrap">' + (tunj > 0 ? formatRupiahVal(tunj) : '<span class="text-muted extra-small">-</span>') + '</td>' +
        '<td class="text-end text-nowrap"><span class="badge bg-success text-white px-2.5 py-1.5" style="font-size: 0.85rem; font-weight: 700; box-shadow: 0 1px 2px rgba(16,185,129,0.25);">' + formatRupiahVal(totalHariItu) + '</span></td>' +
        '<td class="text-nowrap"><small class="text-muted">' + escapeHTML(log.catatan || '-') + '</small></td>' +
        '<td class="text-center text-nowrap">' +
        actionRowHtml +
        '</td>';

      tbody.appendChild(tr);
    });
  }

  window.openInputFromRincian = function () {
    if (isCurrentPeriodClosed) {
      Swal.fire('Periode Ditutup Buku', 'Periode payroll ini sudah ditutup. Data tidak dapat ditambahkan.', 'warning');
      return;
    }
    if (!currentRincianEmpId) return;
    var emp = (dbKaryawan || []).find(function (k) { return String(k.id).toLowerCase() === String(currentRincianEmpId).toLowerCase(); });
    if (!emp) return;
    openModalDataGaji(null, emp);

  window.editLogFromRincian = function (logId) {
    if (isCurrentPeriodClosed) {
      Swal.fire('Periode Ditutup Buku', 'Periode payroll ini sudah ditutup. Data tidak dapat diubah.', 'warning');
      return;
    }
    openModalDataGaji(logId);

  window.deleteLogFromRincian = function (logId, date) {
    if (isCurrentPeriodClosed) {
      Swal.fire('Periode Ditutup Buku', 'Periode payroll ini sudah ditutup. Data tidak dapat dihapus.', 'warning');
      return;
    }

    Swal.fire({
      title: 'Hapus Catatan Harian Ini?',
      html: 'Hapus data lembur / ritase untuk tanggal <strong>' + escapeHTML(formatDateWithDay(date)) + '</strong>?<br><span class="text-muted extra-small">Total gaji karyawan akan otomatis berkurang sesuai catatan yang dihapus.</span>',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Ya, Hapus',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#dc2626'
    }).then(function (res) {
      if (!res.isConfirmed) return;

      showFullPageLoading('Menghapus data...');

      gasRun('deleteDataGaji', Auth.getToken(), logId).then(function (resp) {
        hideFullPageLoading();
        if (handleSessionExpired(resp)) return;

        if (resp && resp.success) {
          Swal.fire({
            icon: 'success',
            title: 'Terhapus',
            text: resp.message || 'Catatan harian berhasil dihapus.',
            timer: 1500,
            showConfirmButton: false
          });
          // Segarkan data di memori seketika agar UI langsung responsif
          cachedDataGajiLogs = cachedDataGajiLogs.filter(function (l) { return l.id !== logId; });
          renderDataGajiTable();
          if (currentRincianEmpId && bsModalRincianGaji) {
            renderRincianModal(currentRincianEmpId);
          }
          loadDataGajiList();
        } else {
          Swal.fire('Gagal Menghapus', (resp && resp.message) || 'Gagal menghapus data.', 'error');
        }
      }).catch(function (err) {
        hideFullPageLoading();
        Swal.fire('Error', err.toString(), 'error');
      });
    });
  };

  // --- MODAL 3: BUKA PERIODE PAYROLL BARU ---
  window.openModalBukaPeriode = function () {
    var modalEl = document.getElementById('modalBukaPeriode');
    if (!modalEl) return;
    if (!bsModalBukaPeriode) {
      bsModalBukaPeriode = new bootstrap.Modal(modalEl);
    }

    var formEl = document.getElementById('formBukaPeriode');
    if (formEl) formEl.reset();

    var now = new Date();
    var BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var currentMonthName = BULAN_ID[now.getMonth()];

    var nameInput = document.getElementById('inputBukaPeriodeName');
    var startInput = document.getElementById('inputBukaPeriodeStartDate');
    var endInput = document.getElementById('inputBukaPeriodeEndDate');
    var autoCloseCheck = document.getElementById('checkBukaPeriodeAutoClose');

    if (autoCloseCheck) autoCloseCheck.checked = true;

    if (nameInput) {
      nameInput.value = 'Payroll ' + currentMonthName + ' ' + now.getFullYear();
    }

    // Default cut-off dates
    var lastEndDate = null;
    if (currentActivePeriodInfo && currentActivePeriodInfo.endDate) {
      try {
        var pEnd = new Date(currentActivePeriodInfo.endDate);
        if (!isNaN(pEnd.getTime())) {
          pEnd.setDate(pEnd.getDate() + 1);
          lastEndDate = pEnd;
        }
      } catch (e) { }
    }

    if (lastEndDate) {
      var sYear = lastEndDate.getFullYear();
      var sMonth = String(lastEndDate.getMonth() + 1).padStart(2, '0');
      var sDay = String(lastEndDate.getDate()).padStart(2, '0');
      if (startInput) startInput.value = sYear + '-' + sMonth + '-' + sDay;

      var nextEnd = new Date(lastEndDate.getTime());
      nextEnd.setMonth(nextEnd.getMonth() + 1);
      nextEnd.setDate(nextEnd.getDate() - 1);
      var eYear = nextEnd.getFullYear();
      var eMonth = String(nextEnd.getMonth() + 1).padStart(2, '0');
      var eDay = String(nextEnd.getDate()).padStart(2, '0');
      if (endInput) endInput.value = eYear + '-' + eMonth + '-' + eDay;
    } else {
      var yyyy = now.getFullYear();
      var mm = String(now.getMonth() + 1).padStart(2, '0');
      var prevMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 21);
      var prevY = prevMonthDate.getFullYear();
      var prevM = String(prevMonthDate.getMonth() + 1).padStart(2, '0');
      if (startInput) startInput.value = prevY + '-' + prevM + '-21';
      if (endInput) endInput.value = yyyy + '-' + mm + '-20';
    }

    bsModalBukaPeriode.show();
  };

    if (!emp) {
      var sampleLog = cachedDataGajiLogs.find(function (l) {

      });
      if (sampleLog) {
        emp = {
          id: sampleLog.empId || empId,

          dept: sampleLog.dept || '-',
          jabatan: sampleLog.jabatan || '-',
          gajiPokok: sampleLog.basic || 0

      } else {
        emp = {
          id: empId,
          name: empId,
          dept: '-',
          jabatan: '-',
          gajiPokok: 0
        };
      }

    });

    generateAndPrintSalaryReport(emp, kLogs);
  };

  function generateAndPrintSalaryReport(emp, kLogs) {
    var BULAN_INDO = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var now = new Date();
    var tanggalCetak = now.getDate() + ' ' + BULAN_INDO[now.getMonth()] + ' ' + now.getFullYear();

    // Urutkan catatan dari tanggal terawal ke tanggal terakhir (kronologis 1 s/d 31)
    var sortedLogs = (kLogs || []).slice().sort(function (a, b) {
      return String(a.tanggal || '').localeCompare(String(b.tanggal || ''));
    });

    // Tentukan periode laporan berdasarkan Periode Payroll resmi atau tanggal log
    var targetPeriod = '';
    var activeP = cachedPeriodeList.find(function (p) { return p.id === currentSelectedPeriodId; }) || currentActivePeriodInfo;
    if (activeP && activeP.nama) {
      var sDate = activeP.startDate ? safeFormatDateDMY(activeP.startDate) : '';
      var eDate = activeP.endDate ? safeFormatDateDMY(activeP.endDate) : '';
      targetPeriod = activeP.nama.toUpperCase() + (sDate && eDate ? ' (' + sDate + ' s/d ' + eDate + ')' : '');
    } else if (sortedLogs.length > 0 && sortedLogs[sortedLogs.length - 1].tanggal) {
      var s = String(sortedLogs[sortedLogs.length - 1].tanggal).split('T')[0].split(' ')[0];
      var parts = s.split('-');
      if (parts.length === 3 && parts[0].length === 4) {
        var mIdx = Number(parts[1]) - 1;
        if (mIdx >= 0 && mIdx < 12) {
          targetPeriod = BULAN_INDO[mIdx].toUpperCase() + ' ' + parts[0];
        }
      }
    }
    if (!targetPeriod) {
      targetPeriod = BULAN_INDO[now.getMonth()].toUpperCase() + ' ' + now.getFullYear();
    }

    var totalJamOt = 0;

      '</td>' +
      '<td class="summary-card-td">' +
      '<div class="summary-card-title">Total Tunjangan</div>' +
      '<div class="summary-card-val" style="color: #0f172a;">' + formatRupiahVal(totalTunjangan) + '</div>' +
      '<div class="summary-card-sub">Tunjangan Harian</div>' +
      '</td>' +
      '</tr>' +
      '</table>' +

      // BANNER TAKE HOME PAY
      '<div class="take-home-pay-banner">' +
      '<div>' +
      '<div class="take-home-pay-label">Total Penghasilan / Gaji Berjalan Saat Ini</div>' +
      '<div style="font-size: 7pt; color: #15803d; margin-top: 1px;">Kalkulasi: Basic + Overtime + Ritase + Tunjangan Harian</div>' +
      '</div>' +
      '<div class="take-home-pay-value">' + formatRupiahVal(grandTotal) + '</div>' +
      '</div>' +

      // TABEL RINCIAN LOG HARIAN
      '<div style="font-size: 8pt; font-weight: 700; color: #0f172a; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px;">Rincian Log Kerja Harian:</div>' +
      '<table class="data-table">' +
      '<thead>' +
      '<tr>' +
      '<th style="width: 25px;">No</th>' +
      '<th style="width: 110px;">Tanggal Kerja</th>' +
      '<th style="width: 85px;">Overtime</th>' +
      '<th style="width: 75px;">Ritase</th>' +
      '<th style="width: 80px;">Tunjangan</th>' +
      '<th style="width: 95px;">Total Hari Itu</th>' +
      '<th>Catatan / Keterangan</th>' +
      '</tr>' +
      '</thead>' +
      '<tbody>' +
      rowsHtml +
      '</tbody>' +
      '<tfoot>' +
      '<tr>' +
      '<td colspan="2" style="text-align: right; text-transform: uppercase;">Total Penghasilan Harian:</td>' +
      '<td style="text-align: right; color: #1d4ed8;">' + formatRupiahVal(totalNominalOt) + '</td>' +
      '<td style="text-align: right; color: #b45309;">' + formatRupiahVal(totalNominalRit) + '</td>' +
      '<td style="text-align: right;">' + formatRupiahVal(totalTunjangan) + '</td>' +
      '<td style="text-align: right; color: #15803d; font-size: 8.5pt;">' + formatRupiahVal(totalPenghasilanHarian) + '</td>' +
      '<td style="font-weight: normal; font-size: 7pt; color: #64748b;">(' + totalHariKerja + ' Hari Terinput)</td>' +
      '</tr>' +
      '<tr style="background: #e2e8f0 !important; font-size: 8.5pt;">' +
      '<td colspan="5" style="text-align: right; text-transform: uppercase; font-weight: 800;">GRAND TOTAL PENGHASILAN (BASIC + HARIAN):</td>' +
      '<td style="text-align: right; color: #15803d; font-weight: 800; font-size: 9.5pt;">' + formatRupiahVal(grandTotal) + '</td>' +
      '<td></td>' +
      '</tr>' +
      '</tfoot>' +
      '</table>' +

      // KOLOM TANDA TANGAN
      '<table class="sig-table">' +
      '<tr>' +
      '<td class="sig-card">' +
      '<div class="sig-title">Disiapkan Oleh,</div>' +
      '<div class="sig-area">' +
      '<div class="sig-badge"><i class="bi bi-shield-check"></i> DIGITAL SIGNED</div>' +
      '</div>' +
      '<div class="sig-name">' + escapeHTML(authorName) + '</div>' +
      '<div class="sig-role">HRD / Payroll Dept</div>' +
      '</td>' +
      '<td class="sig-card">' +
      '<div class="sig-title">Karyawan Yang Bersangkutan,</div>' +
      '<div class="sig-area"></div>' +
      '<div class="sig-name">' + escapeHTML(emp.name) + '</div>' +
      '<div class="sig-role">ID: ' + escapeHTML(emp.id) + '</div>' +
      '</td>' +
      '<td class="sig-card">' +
      '<div class="sig-title">Mengetahui / Menyetujui,</div>' +
      '<div class="sig-area"></div>' +
      '<div class="sig-name">PIMPINAN / DIREKSI</div>' +
      '<div class="sig-role">PT. Berkah Batu Bara</div>' +
      '</td>' +
      '</tr>' +
      '</table>' +

      // FOOTER DOKUMEN
      '<div class="report-footer-note">' +
      '<span>* Dokumen ini dibuat otomatis oleh Sistem Informasi Penggajian PT. Berkah Batu Bara pada ' + escapeHTML(tanggalCetak) + '.</span>' +
      '<span>Halaman 1 / 1 &nbsp;|&nbsp; ' + escapeHTML(nomorDokumen) + '</span>' +
      '</div>' +

      '</div>';

    var docTitle = 'Laporan_Gaji_' + String(emp.name).replace(/[^a-zA-Z0-9]/g, '_') + '_' + String(targetPeriod).replace(/[^a-zA-Z0-9]/g, '_');

    // Buat iframe tersembunyi untuk mencetak dokumen
    var iframeId = 'print-salary-report-iframe';
    var iframe = document.getElementById(iframeId);
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.id = iframeId;
      iframe.style.position = 'fixed';
      iframe.style.right = '0';
      iframe.style.bottom = '0';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = '0';
      document.body.appendChild(iframe);
    }

    var doc = iframe.contentWindow || iframe.contentDocument;
    if (doc.document) doc = doc.document;

    doc.open();
    doc.write('<!DOCTYPE html><html><head><base href="' + window.location.href + '"><title>' + escapeHTML(docTitle) + '<\/title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>' + cssContent + '<\/style><\/head><body>' + paperHtml + '<\/body><\/html>');
    doc.close();

    var triggerPrint = function () {
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch (e) {
        console.warn('Iframe print failed, falling back to window.print():', e);
        window.print();
      }
    };

    var imgs = doc.images || [];
    if (imgs.length > 0) {
      var loaded = 0;
      var total = imgs.length;
      var done = false;
      var checkFinish = function () {
        if (done) return;
        loaded++;
        if (loaded >= total) {
          done = true;
          setTimeout(triggerPrint, 200);
        }
      };

      for (var i = 0; i < imgs.length; i++) {
        if (imgs[i].complete) {
          checkFinish();
        } else {
          imgs[i].onload = checkFinish;
          imgs[i].onerror = checkFinish;
        }
      }
      setTimeout(function () {
        if (!done) {
          done = true;
          triggerPrint();
        }
      }, 1000);
    } else {
      setTimeout(triggerPrint, 300);
    }
  }

  // =========================================================================
  // HALAMAN RINCIAN GAJI SAYA (KHUSUS KARYAWAN - AKSES HANYA LIHAT / CETAK PDF)
  // =========================================================================
  var cachedGajiSayaData = null;

  window.initGajiSayaPage = function () {
    var tbody = document.getElementById('tableBodyGajiSaya');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2 text-primary" role="status"></span>Mengambil rincian gaji harian Anda...</td></tr>';
    }

    var token = (typeof Auth !== 'undefined' && Auth.getToken) ? Auth.getToken() : null;
    if (!token) return;

    gasRun('getDataGaji', token, null, null, currentSelectedPeriodId).then(function (res) {
      if (typeof handleSessionExpired === 'function' && handleSessionExpired(res)) return;

      if (res && res.success) {
        cachedGajiSayaData = res;
        cachedDataGajiLogs = Array.isArray(res.list) ? res.list : [];
        if (Array.isArray(res.periods)) cachedPeriodeList = res.periods;
        if (res.period) {
          currentActivePeriodInfo = res.period;
          if (!currentSelectedPeriodId) currentSelectedPeriodId = res.period.id;
        }
        populatePeriodeDropdowns(res.periods, res.period);
        renderGajiSayaPage(res);
      } else {
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">' + escapeHTML(res.message || 'Gagal memuat rincian gaji.') + '</td></tr>';
        }
      }
    }).catch(function (err) {
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Gagal memproses data: ' + escapeHTML(err.toString()) + '</td></tr>';
      }
    });
  };

  window.renderGajiSayaPage = function (data) {
    var user = (typeof Auth !== 'undefined' && Auth.getUser) ? Auth.getUser() : {};
    var res = data || cachedGajiSayaData || { list: [], employees: [] };
    var logs = Array.isArray(res.list) ? res.list : [];
    var empSummary = (Array.isArray(res.employees) && res.employees.length > 0) ? res.employees[0] : null;

    // Hitung total akumulasi
    var basic = empSummary ? (Number(empSummary.basic) || 0) : 0;
    var totalJamOt = empSummary ? (Number(empSummary.totalJamOt) || 0) : 0;
    var totalNominalOt = empSummary ? (Number(empSummary.totalNominalOt) || 0) : 0;
    var totalRitase = empSummary ? (Number(empSummary.totalRitase) || 0) : 0;
    var totalNominalRit = empSummary ? (Number(empSummary.totalNominalRit) || 0) : 0;
    var totalTunjangan = empSummary ? (Number(empSummary.totalTunjangan) || 0) : 0;
    var grandTotal = empSummary ? (Number(empSummary.grandTotal) || (basic + totalNominalOt + totalNominalRit + totalTunjangan)) : 0;
    var daysCount = empSummary ? (Number(empSummary.daysCount) || logs.length) : logs.length;

    // Fallback jika empSummary belum diisi
    if (!empSummary && logs.length > 0) {
      basic = Number(logs[0].basic) || 0;
      var uniqueDates = new Set();
      logs.forEach(function (l) {
        totalJamOt += Number(l.jamOvertime || 0);
        totalNominalOt += Number(l.totalOvertime || (l.jamOvertime * l.tarifOvertime) || 0);
        totalRitase += Number(l.ritase || 0);
        totalNominalRit += Number(l.totalRitase || (l.ritase * l.tarifRitase) || 0);
        totalTunjangan += Number(l.tunjanganHarian || 0);
        if (l.tanggal) uniqueDates.add(String(l.tanggal).trim());
      });
      daysCount = uniqueDates.size || logs.length;
      grandTotal = basic + totalNominalOt + totalNominalRit + totalTunjangan;
    }

    // Update elemen UI kartu ringkasan
    var elPokok = document.getElementById('gajiSayaPokok');
    var elEmpInfo = document.getElementById('gajiSayaEmpInfo');
    var elTotOt = document.getElementById('gajiSayaTotOt');
    var elJamOt = document.getElementById('gajiSayaJamOt');
    var elTotRit = document.getElementById('gajiSayaTotRit');
    var elJmlRit = document.getElementById('gajiSayaJmlRit');
    var elTotTunj = document.getElementById('gajiSayaTotTunj');
    var elGrandTotal = document.getElementById('gajiSayaGrandTotal');
    var elHariKerja = document.getElementById('gajiSayaHariKerja');
    var elBadgeCount = document.getElementById('badgeCountGajiSaya');

    if (elPokok) elPokok.textContent = formatRupiahVal(basic);
    if (elEmpInfo) elEmpInfo.textContent = (empSummary ? (empSummary.deptJabatan || empSummary.dept || '') : (user.dept || '')) || 'Gaji Pokok';
    if (elTotOt) elTotOt.textContent = formatRupiahVal(totalNominalOt);
    if (elJamOt) elJamOt.textContent = totalJamOt + ' Jam Overtime';
    if (elTotRit) elTotRit.textContent = formatRupiahVal(totalNominalRit);
    if (elJmlRit) elJmlRit.textContent = totalRitase + ' Ritase';
    if (elTotTunj) elTotTunj.textContent = formatRupiahVal(totalTunjangan);
    if (elGrandTotal) elGrandTotal.textContent = formatRupiahVal(grandTotal);
    if (elHariKerja) elHariKerja.textContent = daysCount + ' Hari Kerja';
    if (elBadgeCount) elBadgeCount.textContent = logs.length + ' Catatan';

    // Render tabel rincian harian
    var tbody = document.getElementById('tableBodyGajiSaya');
    if (!tbody) return;

    if (logs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-5"><i class="bi bi-inbox fs-2 d-block mb-2 text-secondary"></i>Belum ada catatan rincian kerja/gaji harian untuk periode ini.</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    logs.forEach(function (log, idx) {
      var jamOt = Number(log.jamOvertime) || 0;
      var totOt = Number(log.totalOvertime) || 0;
      var rit = Number(log.ritase) || 0;
      var totRit = Number(log.totalRitase) || 0;
      var tunj = Number(log.tunjanganHarian) || 0;
      var totalHariItu = Number(log.totalGaji) || (totOt + totRit + tunj);

      var otStr = jamOt > 0
        ? '<div class="fw-bold text-dark">' + jamOt + ' Jam</div><small class="text-muted extra-small">' + formatRupiahVal(totOt) + '</small>'
        : '<span class="text-muted extra-small">-</span>';

      var ritStr = rit > 0
        ? '<div class="fw-bold text-dark">' + rit + ' Rit</div><small class="text-muted extra-small">' + formatRupiahVal(totRit) + '</small>'
        : '<span class="text-muted extra-small">-</span>';

      var tunjStr = tunj > 0
        ? '<div class="fw-semibold text-dark">' + formatRupiahVal(tunj) + '</div>'
        : '<span class="text-muted extra-small">-</span>';

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="text-center text-muted extra-small text-nowrap">' + (idx + 1) + '</td>' +
        '<td class="fw-bold text-nowrap"><i class="bi bi-calendar-event me-1.5 text-primary"></i>' + escapeHTML(formatDateWithDay(log.tanggal)) + '</td>' +
        '<td class="text-end text-nowrap">' + otStr + '</td>' +
        '<td class="text-end text-nowrap">' + ritStr + '</td>' +
        '<td class="text-end text-nowrap">' + tunjStr + '</td>' +
        '<td class="text-end text-nowrap"><span class="badge bg-success text-white px-2.5 py-1.5" style="font-size: 0.85rem; font-weight: 700; box-shadow: 0 1px 2px rgba(16,185,129,0.25);">' + formatRupiahVal(totalHariItu) + '</span></td>' +
        '<td><small class="text-muted">' + escapeHTML(log.catatan || '-') + '</small></td>';

      tbody.appendChild(tr);
    });
  };

  window.printRincianGajiSayaDoc = function () {
    var user = (typeof Auth !== 'undefined' && Auth.getUser) ? Auth.getUser() : null;
    if (!user) {
      Swal.fire('Perhatian', 'Sesi login tidak ditemukan.', 'warning');
      return;
    }

    var empIdentifier = user.username || user.fullname;
    var empSummary = (cachedGajiSayaData && Array.isArray(cachedGajiSayaData.employees) && cachedGajiSayaData.employees.length > 0)
      ? cachedGajiSayaData.employees[0]
      : null;

    var emp = {
      id: (empSummary && empSummary.id) || user.username || '-',
      name: (empSummary && empSummary.name) || user.fullname || user.username || '-',
      dept: (empSummary && empSummary.dept) || user.dept || '-',
      jabatan: (empSummary && empSummary.jabatan) || user.jabatan || '-',
      gajiPokok: (empSummary && empSummary.basic) || user.basic || 0
    };

    var logs = (cachedGajiSayaData && Array.isArray(cachedGajiSayaData.list))
      ? cachedGajiSayaData.list
      : cachedDataGajiLogs;

    if (!logs || logs.length === 0) {
      Swal.fire('Info', 'Belum ada data rincian harian untuk dicetak.', 'info');
      return;
    }

    generateAndPrintSalaryReport(emp, logs);
  };

})();
</script>
