      var isTKMasterOff = (k.bpjsTKSetting === 'Tidak Ikut' || k.bpjsTKSetting === 'Non Aktif');
      var kesSet = isKesMasterOff ? 'Tidak Ikut' : (detailPot.bpjsKesSetting || k.bpjsKesSetting || 'Tidak Ikut');
      var tkSet = isTKMasterOff ? 'Tidak Ikut' : (detailPot.bpjsTKSetting || k.bpjsTKSetting || 'Tidak Ikut');

      var potKes = (kesSet === 'Tidak Ikut') ? 0 : (empSummary ? (Number(empSummary.potonganBPJSKes) || 0) : (Number(k.bpjsKesNominal) || 0));
      var potTk = (tkSet === 'Tidak Ikut') ? 0 : (empSummary ? (Number(empSummary.potonganBPJSTK) || 0) : (Number(k.bpjsTKNominal) || 0));
      var potPph = (empSummary && empSummary.potonganPPh21 !== undefined) ? (Number(empSummary.potonganPPh21) || 0) : (Number(k.pph21Nominal) || 0);

      var potKasbon = empSummary ? (Number(empSummary.potonganKasbon) || 0) : 0;
      var catKasbon = empSummary ? (empSummary.catatanKasbon || '') : '';
      var potLain = empSummary ? (Number(empSummary.potonganLain) || 0) : 0;
      var catPotLain = empSummary ? (empSummary.catatanPotonganLain || '') : '';

      var pkwtNom = empSummary ? (Number(empSummary.kompensasiPKWT) || 0) : ((detailPot && Number(detailPot.kompensasiPKWT)) || 0);
      var pkwtTgl = empSummary ? (empSummary.tanggalKompensasiPKWT || '') : ((detailPot && detailPot.tanggalKompensasiPKWT) || '');
      var pkwtCat = empSummary ? (empSummary.keteranganPKWT || '') : ((detailPot && detailPot.keteranganPKWT) || '');

      currentSelectedPotonganEmp = {
        empId: k.id,
        empName: k.name,
        dept: k.dept || (empSummary ? empSummary.dept : '-'),
        basic: basic,
        totalTambahan: totalTambahan,
        periodId: currentSelectedPeriodId
      };

      document.getElementById('potonganEmpId').value = k.id;
      document.getElementById('potonganPeriodId').value = currentSelectedPeriodId;
      document.getElementById('potonganEmpName').innerText = k.name;
      document.getElementById('potonganEmpDept').innerText = currentSelectedPotonganEmp.dept;
      document.getElementById('potonganEmpIdMeta').innerText = 'ID: ' + k.id;
      document.getElementById('potonganEmpBasicDisplay').innerText = formatRupiahVal(basic);

      // Set setting selects & inputs
      var elKesSet = document.getElementById('potonganBpjsKesSetting');
      if (elKesSet) elKesSet.value = kesSet;
      var elKesNom = document.getElementById('potonganBpjsKesNominal');
      if (elKesNom) { elKesNom.value = potKes > 0 ? formatRupiahVal(potKes) : 'Rp 0'; setupRupiahMask(elKesNom); }

      var elTkSet = document.getElementById('potonganBpjsTKSetting');
      if (elTkSet) elTkSet.value = tkSet;
      var elTkNom = document.getElementById('potonganBpjsTKNominal');
      if (elTkNom) { elTkNom.value = potTk > 0 ? formatRupiahVal(potTk) : 'Rp 0'; setupRupiahMask(elTkNom); }

      var elPphNom = document.getElementById('potonganPph21Nominal');
      if (elPphNom) { elPphNom.value = potPph > 0 ? formatRupiahVal(potPph) : 'Rp 0'; setupRupiahMask(elPphNom); }

      // Set Kompensasi PKWT
      var elPkwtTgl = document.getElementById('potonganPkwtTanggal');
      if (elPkwtTgl) elPkwtTgl.value = pkwtTgl;
      var elPkwtNom = document.getElementById('potonganPkwtNominal');
      if (elPkwtNom) { elPkwtNom.value = pkwtNom > 0 ? formatRupiahVal(pkwtNom) : 'Rp 0'; setupRupiahMask(elPkwtNom); }
      var elPkwtCat = document.getElementById('potonganPkwtCatatan');
      if (elPkwtCat) elPkwtCat.value = pkwtCat;
      var elHelperBulan = document.getElementById('helperPkwtBulan');
      if (elHelperBulan) elHelperBulan.value = '12';

      // RENDER BARIS PINJAMAN KASBON SESUAI TANGGAL
      var tbodyKasbon = document.getElementById('tbodyKasbonList');
      if (tbodyKasbon) {
        tbodyKasbon.innerHTML = '';
        var listKasbon = (detailPot && Array.isArray(detailPot.listKasbon) && detailPot.listKasbon.length > 0)
          ? detailPot.listKasbon
          : [];

        if (listKasbon.length > 0) {
          listKasbon.forEach(function (kb) {
            addKasbonRow(kb.tanggal, kb.nominal, kb.catatan);
          });
        } else if (potKasbon > 0) {
          addKasbonRow('', potKasbon, catKasbon);
        } else {
          addKasbonRow('', 0, '');
        }
      }

      // RENDER BARIS KLAIM REIMBURSEMENT
      var tbodyKlaim = document.getElementById('tbodyKlaimList');
      if (tbodyKlaim) {
        tbodyKlaim.innerHTML = '';
        var listKlaim = (detailPot && Array.isArray(detailPot.listKlaim) && detailPot.listKlaim.length > 0)
          ? detailPot.listKlaim
          : (empSummary && Array.isArray(empSummary.listKlaim) && empSummary.listKlaim.length > 0 ? empSummary.listKlaim : []);

        if (listKlaim.length > 0) {
          listKlaim.forEach(function (kl) {
            addKlaimRow(kl.tanggal, kl.kategori, kl.nominal, kl.catatan);
          });
        } else if (empSummary && empSummary.totalKlaim > 0) {
          if (empSummary.klaimTravel > 0) addKlaimRow('', 'Klaim Travel', empSummary.klaimTravel, 'Reimbursement Travel');
          if (empSummary.klaimMCU > 0) addKlaimRow('', 'Klaim MCU Mandiri', empSummary.klaimMCU, 'Medical Check-Up Mandiri');
          if (empSummary.klaimLainnya > 0) addKlaimRow('', 'Klaim Lainnya', empSummary.klaimLainnya, 'Klaim Lainnya');
        } else {
          addKlaimRow('', 'Klaim Travel', 0, '');
        }
      }

      // Set Potongan Lain
      var elLainTgl = document.getElementById('potonganLainTanggal');
      if (elLainTgl) elLainTgl.value = (detailPot && detailPot.potonganLainTanggal) ? detailPot.potonganLainTanggal : '';
      var elLainNom = document.getElementById('potonganLainNominal');
      if (elLainNom) { elLainNom.value = potLain > 0 ? formatRupiahVal(potLain) : 'Rp 0'; setupRupiahMask(elLainNom); }
      var elLainCat = document.getElementById('potonganLainCatatan');
      if (elLainCat) elLainCat.value = catPotLain;

      // Reset Tab aktif ke Tab 1 (Potongan Pokok)
      var tabPotonganBtn = document.getElementById('tab-potongan-btn');
      if (tabPotonganBtn && typeof bootstrap !== 'undefined' && bootstrap.Tab) {
        var triggerTab = new bootstrap.Tab(tabPotonganBtn);
        triggerTab.show();
      }

      calculatePotonganLive();
      bsModalPotonganGaji.show();
    };

    window.quickCalcPKWTModal = function () {
      if (!currentSelectedPotonganEmp) return;
      var basic = Number(currentSelectedPotonganEmp.basic) || 0;
      var elBulan = document.getElementById('helperPkwtBulan');
      var bulan = elBulan ? (parseFloat(elBulan.value) || 12) : 12;
      var calcNom = Math.round((bulan / 12) * basic);
      var elNom = document.getElementById('potonganPkwtNominal');
      if (elNom) {
        elNom.value = formatRupiahVal(calcNom);
      }
      var elCat = document.getElementById('potonganPkwtCatatan');
      if (elCat && !elCat.value.trim()) {
        elCat.value = 'Kompensasi PKWT ' + bulan + ' Bulan (PP 35/2021)';
      }
      calculatePotonganLive();
    };

    window.onPotonganModalKesSettingChange = function () {
      if (!currentSelectedPotonganEmp) return;
      var setVal = document.getElementById('potonganBpjsKesSetting').value;
      var nomEl = document.getElementById('potonganBpjsKesNominal');
      var basic = currentSelectedPotonganEmp.basic;
      if (setVal === 'Kelas 1') {
        nomEl.value = formatRupiahVal(150000);
      } else if (setVal === 'Kelas 2') {
        nomEl.value = formatRupiahVal(100000);
      } else if (setVal === 'Kelas 3') {
        nomEl.value = formatRupiahVal(35000);
      } else if (setVal === 'PPU 1%') {
        nomEl.value = formatRupiahVal(Math.round(basic * 0.01));
      } else if (setVal === 'Tidak Ikut') {
        nomEl.value = 'Rp 0';
      }
      calculatePotonganLive();
    };

    window.quickCalcBpjsKesModal = function () {
      window.onPotonganModalKesSettingChange();
    };

    window.onPotonganModalTKSettingChange = function () {
      if (!currentSelectedPotonganEmp) return;
      var setVal = document.getElementById('potonganBpjsTKSetting').value;
      var nomEl = document.getElementById('potonganBpjsTKNominal');
      var basic = currentSelectedPotonganEmp.basic;
      if (setVal === 'Standar 3%') {
        nomEl.value = formatRupiahVal(Math.round(basic * 0.03));
      } else if (setVal === 'Tidak Ikut') {
        nomEl.value = 'Rp 0';
      }
      calculatePotonganLive();
    };

    window.quickCalcBpjsTKModal = function () {
      window.onPotonganModalTKSettingChange();
    };

    window.calculatePotonganLive = function () {
      if (!currentSelectedPotonganEmp) return;
      var basic = Number(currentSelectedPotonganEmp.basic) || 0;
      var potKes = parseRupiahVal(document.getElementById('potonganBpjsKesNominal') ? document.getElementById('potonganBpjsKesNominal').value : 0);
      var potTk = parseRupiahVal(document.getElementById('potonganBpjsTKNominal') ? document.getElementById('potonganBpjsTKNominal').value : 0);
      var potPph = parseRupiahVal(document.getElementById('potonganPph21Nominal') ? document.getElementById('potonganPph21Nominal').value : 0);

      // Hitung seluruh item pinjaman kasbon dari tabel
      var kasbonRows = document.querySelectorAll('#tbodyKasbonList tr.kasbon-item-row');
      var totalKasbon = 0;
      var countKasbon = 0;
      kasbonRows.forEach(function (row) {
        var nomInput = row.querySelector('.kasbon-item-nominal');
        var nom = parseRupiahVal(nomInput ? nomInput.value : 0);
        if (nom > 0) {
          totalKasbon += nom;
          countKasbon++;
        }
      });

      // Hitung seluruh item klaim reimbursement dari tabel
      var klaimRows = document.querySelectorAll('#tbodyKlaimList tr.klaim-item-row');
      var totalKlaim = 0;
      var klaimTravel = 0;
      var klaimMCU = 0;
      var klaimLainnya = 0;
      var countKlaim = 0;

      klaimRows.forEach(function (row) {
        var nomInput = row.querySelector('.klaim-item-nominal');
        var katSelect = row.querySelector('.klaim-item-kategori');
        var nom = parseRupiahVal(nomInput ? nomInput.value : 0);
        var kat = katSelect ? katSelect.value : 'Klaim Travel';

        if (nom > 0) {
          totalKlaim += nom;
          countKlaim++;
          if (kat === 'Klaim Travel') {
            klaimTravel += nom;
          } else if (kat === 'Klaim MCU Mandiri') {
            klaimMCU += nom;
          } else {
            klaimLainnya += nom;
          }
        }
      });

      var potLain = parseRupiahVal(document.getElementById('potonganLainNominal') ? document.getElementById('potonganLainNominal').value : 0);
      var pkwtNom = parseRupiahVal(document.getElementById('potonganPkwtNominal') ? document.getElementById('potonganPkwtNominal').value : 0);

      var subtotalPotPokok = potKes + potTk + potPph;
      var gajiPokokBersih = Math.max(0, basic - subtotalPotPokok);
      var tambahan = Number(currentSelectedPotonganEmp.totalTambahan) || 0;
      var gajiSebelumKasbon = gajiPokokBersih + tambahan + pkwtNom + totalKlaim;
      var subtotalKasbonLain = totalKasbon + potLain;
      var takeHomePay = Math.max(0, gajiSebelumKasbon - subtotalKasbonLain);

      // Update text di tabel kasbon
      var elTotalKasbon = document.getElementById('textTotalKasbonModal');
      if (elTotalKasbon) elTotalKasbon.innerText = formatRupiahVal(totalKasbon);
      var elCountKasbon = document.getElementById('textKasbonCount');
      if (elCountKasbon) elCountKasbon.innerText = countKasbon + ' Transaksi Pinjaman (' + formatRupiahVal(totalKasbon) + ')';

      // Update text di tabel klaim
      var elTotalKlaim = document.getElementById('textTotalKlaimModal');
      if (elTotalKlaim) elTotalKlaim.innerText = formatRupiahVal(totalKlaim);
      var elCountKlaim = document.getElementById('textKlaimCount');
      if (elCountKlaim) elCountKlaim.innerText = countKlaim + ' Item Klaim (' + formatRupiahVal(totalKlaim) + ')';
      var elBadgeTravel = document.getElementById('textKlaimTravelBadge');
      if (elBadgeTravel) elBadgeTravel.innerText = 'Travel: ' + formatRupiahVal(klaimTravel);
      var elBadgeMCU = document.getElementById('textKlaimMCUBadge');
      if (elBadgeMCU) elBadgeMCU.innerText = 'MCU: ' + formatRupiahVal(klaimMCU);
      var elBadgeLainnya = document.getElementById('textKlaimLainnyaBadge');
      if (elBadgeLainnya) elBadgeLainnya.innerText = 'Lainnya: ' + formatRupiahVal(klaimLainnya);
      var badgeKlaimNav = document.getElementById('badgeKlaimCount');
      if (badgeKlaimNav) {
        if (countKlaim > 0) {
          badgeKlaimNav.style.display = 'inline-block';
          badgeKlaimNav.innerText = countKlaim;
        } else {
          badgeKlaimNav.style.display = 'none';
        }
      }

      var elPreviewPokokBersih = document.getElementById('previewGajiPokokBersih');
      if (elPreviewPokokBersih) elPreviewPokokBersih.innerText = formatRupiahVal(gajiPokokBersih);
      var elPreviewSubPotPokok = document.getElementById('previewSubtotalPotPokok');
      if (elPreviewSubPotPokok) elPreviewSubPotPokok.innerText = 'Potongan: -' + formatRupiahVal(subtotalPotPokok);

      var elPrevBasic = document.getElementById('prevBasicVal');
      if (elPrevBasic) elPrevBasic.innerText = formatRupiahVal(basic);
      var elPrevPotPokok = document.getElementById('prevPotPokokVal');
      if (elPrevPotPokok) elPrevPotPokok.innerText = '- ' + formatRupiahVal(subtotalPotPokok);
      var elPrevPokokBersih = document.getElementById('prevPokokBersihVal');
      if (elPrevPokokBersih) elPrevPokokBersih.innerText = formatRupiahVal(gajiPokokBersih);
      var elPrevTambahan = document.getElementById('prevTambahanVal');
      if (elPrevTambahan) elPrevTambahan.innerText = '+ ' + formatRupiahVal(tambahan);
      var elPrevPkwt = document.getElementById('prevPkwtVal');
      if (elPrevPkwt) elPrevPkwt.innerText = '+ ' + formatRupiahVal(pkwtNom);
      var elPrevKlaim = document.getElementById('prevKlaimVal');
      if (elPrevKlaim) elPrevKlaim.innerText = '+ ' + formatRupiahVal(totalKlaim);
      var elPrevSblmKasbon = document.getElementById('prevSblmKasbonVal');
      if (elPrevSblmKasbon) elPrevSblmKasbon.innerText = formatRupiahVal(gajiSebelumKasbon);
      var elPrevKasbonLain = document.getElementById('prevKasbonLainVal');
      if (elPrevKasbonLain) elPrevKasbonLain.innerText = '- ' + formatRupiahVal(subtotalKasbonLain);
      var elPrevTHP = document.getElementById('prevTakeHomePayVal');
      if (elPrevTHP) elPrevTHP.innerText = formatRupiahVal(takeHomePay);
    };

    window.submitPotonganGaji = function (e) {
      if (e && e.preventDefault) e.preventDefault();
      if (!currentSelectedPotonganEmp) return;

      var empId = document.getElementById('potonganEmpId').value;
      var periodId = document.getElementById('potonganPeriodId').value;
      var potKes = parseRupiahVal(document.getElementById('potonganBpjsKesNominal') ? document.getElementById('potonganBpjsKesNominal').value : 0);
      var potTk = parseRupiahVal(document.getElementById('potonganBpjsTKNominal') ? document.getElementById('potonganBpjsTKNominal').value : 0);
      var potPph = parseRupiahVal(document.getElementById('potonganPph21Nominal') ? document.getElementById('potonganPph21Nominal').value : 0);

      // Ambil list transaksi pinjaman kasbon
      var listKasbon = [];
      var kasbonNotes = [];
      var kasbonRows = document.querySelectorAll('#tbodyKasbonList tr.kasbon-item-row');
      var totalKasbon = 0;

      kasbonRows.forEach(function (row) {
        var dateInput = row.querySelector('.kasbon-item-date');
        var nomInput = row.querySelector('.kasbon-item-nominal');
        var noteInput = row.querySelector('.kasbon-item-note');

        var tgl = dateInput ? dateInput.value : '';
        var nom = parseRupiahVal(nomInput ? nomInput.value : 0);
        var note = noteInput ? noteInput.value.trim() : '';

        if (nom > 0) {
          totalKasbon += nom;
          listKasbon.push({
            tanggal: tgl,
            nominal: nom,
            catatan: note
          });
          var formattedTgl = tgl ? safeFormatDateDMY(tgl) : '-';
          kasbonNotes.push(formattedTgl + ': ' + formatRupiahVal(nom) + (note ? ' (' + note + ')' : ''));
        }
      });

      // Ambil list transaksi klaim reimbursement
      var listKlaim = [];
      var klaimRows = document.querySelectorAll('#tbodyKlaimList tr.klaim-item-row');
      var totalKlaim = 0;
      var klaimTravel = 0;
      var klaimMCU = 0;
      var klaimLainnya = 0;

      klaimRows.forEach(function (row) {
        var dateInput = row.querySelector('.klaim-item-date');
        var katSelect = row.querySelector('.klaim-item-kategori');
        var nomInput = row.querySelector('.klaim-item-nominal');
        var noteInput = row.querySelector('.klaim-item-note');

        var tgl = dateInput ? dateInput.value : '';
        var kat = katSelect ? katSelect.value : 'Klaim Travel';
        var nom = parseRupiahVal(nomInput ? nomInput.value : 0);
        var note = noteInput ? noteInput.value.trim() : '';

        if (nom > 0) {
          totalKlaim += nom;
          if (kat === 'Klaim Travel') klaimTravel += nom;
          else if (kat === 'Klaim MCU Mandiri') klaimMCU += nom;
          else klaimLainnya += nom;

          listKlaim.push({
            tanggal: tgl,
            kategori: kat,
            nominal: nom,
            catatan: note
          });
        }
      });

      var catKasbonStr = kasbonNotes.join('; ');
      var potLainTgl = document.getElementById('potonganLainTanggal') ? document.getElementById('potonganLainTanggal').value : '';
      var potLain = parseRupiahVal(document.getElementById('potonganLainNominal') ? document.getElementById('potonganLainNominal').value : 0);
      var catPotLain = document.getElementById('potonganLainCatatan') ? document.getElementById('potonganLainCatatan').value.trim() : '';
      if (potLainTgl && catPotLain) {
        catPotLain = safeFormatDateDMY(potLainTgl) + ': ' + catPotLain;
      }

      var kesSet = document.getElementById('potonganBpjsKesSetting') ? document.getElementById('potonganBpjsKesSetting').value : 'Tidak Ikut';
      var tkSet = document.getElementById('potonganBpjsTKSetting') ? document.getElementById('potonganBpjsTKSetting').value : 'Tidak Ikut';

      var pkwtTgl = document.getElementById('potonganPkwtTanggal') ? document.getElementById('potonganPkwtTanggal').value : '';
      var pkwtNom = parseRupiahVal(document.getElementById('potonganPkwtNominal') ? document.getElementById('potonganPkwtNominal').value : 0);
      var pkwtCat = document.getElementById('potonganPkwtCatatan') ? document.getElementById('potonganPkwtCatatan').value.trim() : '';

      var payload = {
        empId: empId,
        empName: currentSelectedPotonganEmp.empName,
        periodId: periodId,
        potonganBPJSKes: potKes,
        potonganBPJSTK: potTk,
        potonganPPh21: potPph,
        potonganKasbon: totalKasbon,
        catatanKasbon: catKasbonStr,
        potonganLain: potLain,
        catatanPotonganLain: catPotLain,
        kompensasiPKWT: pkwtNom,
        tanggalKompensasiPKWT: pkwtTgl,
        keteranganPKWT: pkwtCat,
        totalKlaim: totalKlaim,
        klaimTravel: klaimTravel,
        klaimMCU: klaimMCU,
        klaimLainnya: klaimLainnya,
        listKlaim: listKlaim,
        detailPotongan: {
          bpjsKesSetting: kesSet,
          bpjsKesNominal: potKes,
          bpjsTKSetting: tkSet,
          bpjsTKNominal: potTk,
          pph21Nominal: potPph,
          listKasbon: listKasbon,
          potonganLainTanggal: potLainTgl,
          kompensasiPKWT: pkwtNom,
          tanggalKompensasiPKWT: pkwtTgl,
          keteranganPKWT: pkwtCat,
          totalKlaim: totalKlaim,
          klaimTravel: klaimTravel,
          klaimMCU: klaimMCU,
          klaimLainnya: klaimLainnya,
          listKlaim: listKlaim
        }
      };

      var btnSubmit = document.getElementById('btnSavePotonganGaji');
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Menyimpan...';
      }

      gasRun('savePotonganGaji', Auth.getToken(), payload).then(function (res) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="bi bi-check2-circle me-1.5"></i>Simpan Potongan, Klaim &amp; Kompensasi';
        }

        if (handleSessionExpired(res)) return;

        if (res && res.success) {
          if (bsModalPotonganGaji) bsModalPotonganGaji.hide();
          Swal.fire({
            icon: 'success',
            title: 'Berhasil Disimpan',
            text: res.message || 'Pengaturan potongan, klaim & kompensasi berhasil diperbarui.',
            timer: 1800,
            showConfirmButton: false
          });
          loadDataGajiList();
        } else {
          Swal.fire('Gagal Menyimpan', res.message || 'Terjadi kesalahan saat menyimpan potongan.', 'error');
        }
      }).catch(function (err) {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="bi bi-check2-circle me-1.5"></i>Simpan Potongan, Klaim &amp; Kompensasi';
        }
        Swal.fire('Error', err.toString(), 'error');
      });
    };

    window.openPotonganFromRincian = function () {
      if (currentRincianEmpId) {
        openModalPotonganGaji(currentRincianEmpId);
      }
    };

  })();
</script>
