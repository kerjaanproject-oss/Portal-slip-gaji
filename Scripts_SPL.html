<script>
  // ==========================================================================
  // MODUL SURAT PERINTAH LEMBUR (SPL), APPROVAL BERJENJANG & CETAK SURAT
  // File: Scripts_SPL.html
  // ==========================================================================

  (function () {
    var dbSPLList = [];
    var currentApprovalTab = 'pending';
    var currentPageRiwayatSPL = 1;
    var pageSizeRiwayatSPL = 10;
    var bsModalDetailSPL = null;
    var bsModalApprovalSPL = null;
    var bsModalCetakSuratSPL = null;

    // --- INITIALIZE & CALCULATION ---

    window.initPengajuanSPLForm = function () {
      var user = (typeof Auth !== 'undefined' && Auth.getUser) ? Auth.getUser() : null;
      if (!user) return;

      var empIdEl = document.getElementById('splEmpId');
      var namaEl = document.getElementById('splEmpNama');
      var deptEl = document.getElementById('splDept');
      var jabEl = document.getElementById('splJabatan');
      var tglEl = document.getElementById('splTanggalLembur');
      var jamMulaiEl = document.getElementById('splJamMulai');
      var jamSelesaiEl = document.getElementById('splJamSelesai');
      var uraianEl = document.getElementById('splUraianPekerjaan');
      var lokasiEl = document.getElementById('splLokasiKerja');

      if (empIdEl) empIdEl.value = user.username || '';
      if (namaEl) namaEl.value = user.fullname || user.username || '';
      if (deptEl) deptEl.value = user.dept || '-';
      if (jabEl) jabEl.value = user.jabatan || 'Karyawan';

      // Set tanggal default hari ini
      if (tglEl && !tglEl.value) {
        var now = new Date();
        var yyyy = now.getFullYear();
        var mm = String(now.getMonth() + 1).padStart(2, '0');
        var dd = String(now.getDate()).padStart(2, '0');
        tglEl.value = yyyy + '-' + mm + '-' + dd;
      }

      if (lokasiEl && !lokasiEl.value) {
        lokasiEl.value = '';
      }

      // Default jam lembur standar (17:00 s/d 20:00)
      if (jamMulaiEl && !jamMulaiEl.value) jamMulaiEl.value = '17:00';
      if (jamSelesaiEl && !jamSelesaiEl.value) jamSelesaiEl.value = '20:00';

      calcTotalJamLembur();
    };

    window.calcTotalJamLembur = function () {
      var jamMulaiEl = document.getElementById('splJamMulai');
      var jamSelesaiEl = document.getElementById('splJamSelesai');
      var labelEl = document.getElementById('splTotalJamDisplay');
      var subEl = document.getElementById('splTotalJamSubDisplay');
      var hiddenValEl = document.getElementById('splTotalJamVal');
      var boxEl = document.getElementById('splCalcBox');

      if (!jamMulaiEl || !jamSelesaiEl) return;

      var startVal = jamMulaiEl.value;
      var endVal = jamSelesaiEl.value;

      if (!startVal || !endVal) {
        if (labelEl) labelEl.innerText = '0 Jam';
        if (subEl) subEl.innerText = 'Tentukan jam mulai & selesai';
        if (hiddenValEl) hiddenValEl.value = '0';
        if (boxEl) boxEl.classList.remove('has-hours');
        return;
      }

      var startParts = startVal.split(':');
      var endParts = endVal.split(':');

      var startMin = parseInt(startParts[0], 10) * 60 + parseInt(startParts[1], 10);
      var endMin = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10);

      var diffMin = 0;
      if (endMin >= startMin) {
        diffMin = endMin - startMin;
      } else {
        // Lewat tengah malam (misal 22:00 s/d 02:00)
        diffMin = (24 * 60 - startMin) + endMin;
      }

      var totalHoursDec = (diffMin / 60);
      var displayHours = Math.floor(diffMin / 60);
      var displayMins = diffMin % 60;

      var textStr = '';
      if (displayHours > 0 && displayMins > 0) {
        textStr = displayHours + ' Jam ' + displayMins + ' Menit';
      } else if (displayHours > 0) {
        textStr = displayHours + ' Jam';
      } else {
        textStr = displayMins + ' Menit';
      }

      if (labelEl) labelEl.innerText = textStr;
      if (subEl) {
        var roundedDec = Math.round(totalHoursDec * 100) / 100;
        subEl.innerText = roundedDec + ' Jam Efektif Lembur';
      }
      if (hiddenValEl) hiddenValEl.value = (Math.round(totalHoursDec * 100) / 100);

      if (boxEl) {
        if (diffMin > 0) boxEl.classList.add('has-hours');
        else boxEl.classList.remove('has-hours');
      }
    };

    // --- SUBMIT PENGAJUAN SPL ---

    window.submitFormPengajuanSPL = function (event) {
      if (event) event.preventDefault();

      var tgl = document.getElementById('splTanggalLembur').value;
      var shift = document.getElementById('splShift') ? document.getElementById('splShift').value : 'Shift Pagi';
      var jamMulai = document.getElementById('splJamMulai').value;
      var jamSelesai = document.getElementById('splJamSelesai').value;
      var totalJam = parseFloat(document.getElementById('splTotalJamVal').value || '0');
      var uraian = (document.getElementById('splUraianPekerjaan').value || '').trim();
      var lokasi = (document.getElementById('splLokasiKerja').value || '').trim();

      if (!tgl) {
        showFormValidationWarning('splTanggalLembur', 'Tanggal lembur wajib diisi.');
        return;
      }
      if (!jamMulai || !jamSelesai) {
        showFormValidationWarning('splJamMulai', 'Jam mulai dan jam selesai lembur wajib diisi.');
        return;
      }
      if (totalJam <= 0) {
        showFormValidationWarning('splJamSelesai', 'Total jam lembur harus lebih besar dari 0.');
        return;
      }
      if (!uraian) {
        showFormValidationWarning('splUraianPekerjaan', 'Uraian pekerjaan lembur wajib diisi secara rinci.');
        return;
      }

      var payload = {
        tanggalLembur: tgl,
        shift: shift,
        jamMulai: jamMulai,
        jamSelesai: jamSelesai,
        totalJam: totalJam,
        uraianPekerjaan: uraian,
        lokasiKerja: lokasi
      };

      var btnSubmit = document.getElementById('btnSubmitSPL');
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-1.5"></span>Menyimpan SPL...';
      }

      showFullPageLoading('Mengirim pengajuan Surat Perintah Lembur...');

      gasRun('simpanPengajuanSPL', Auth.getToken(), payload).then(function (res) {
        hideFullPageLoading();
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="bi bi-send-fill me-1.5"></i>Kirim Pengajuan SPL';
        }
        if (handleSessionExpired(res)) return;

        if (res && res.success) {
          Swal.fire({
            icon: 'success',
            title: 'Pengajuan Berhasil!',
            html: 'Surat Perintah Lembur berhasil diajukan dengan ID: <strong>' + escapeHTML(res.splId) + '</strong>.<br><small class="text-muted">Pengajuan Anda akan diproses melalui alur persetujuan Atasan Langsung &amp; HRD.</small>',
            showCancelButton: true,
            confirmButtonText: '<i class="bi bi-clock-history me-1"></i>Lihat Riwayat SPL',
            cancelButtonText: 'Buat SPL Baru',
            confirmButtonColor: '#2563eb',
            cancelButtonColor: '#64748b'
          }).then(function (result) {
            if (result.isConfirmed) {
              showPage('riwayat-spl');
            } else {
              // Reset form
              document.getElementById('splUraianPekerjaan').value = '';
              calcTotalJamLembur();
            }
          });
        } else {
          Swal.fire('Gagal Mengajukan', (res && res.message) || 'Terjadi kesalahan sistem.', 'error');
        }
      }).catch(function (err) {
        hideFullPageLoading();
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="bi bi-send-fill me-1.5"></i>Kirim Pengajuan SPL';
        }
        Swal.fire('Error', err.toString(), 'error');
      });
    };

    // Helper escape HTML
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Helper angka romawi untuk nomor surat
    function getRomanMonth(monthNum) {
      var roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
      return roman[(monthNum - 1) % 12] || 'I';
    }

    var BULAN_INDO = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    // Helper formatting tanggal Indonesia lengkap
    function formatDateIndo(dateVal, withTime) {
      if (!dateVal || dateVal === '-') return '-';
      var d = null;
      if (dateVal instanceof Date) {
        d = isNaN(dateVal.getTime()) ? null : dateVal;
      } else {
        var s = String(dateVal).trim();
        var dmMatch = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (dmMatch) {
          d = new Date(parseInt(dmMatch[3], 10), parseInt(dmMatch[2], 10) - 1, parseInt(dmMatch[1], 10));
        } else {
          var cleanStr = s.replace(/\s*\(Waktu Indonesia [^\)]+\)/i, '').trim();
          var p = new Date(cleanStr);
          if (!isNaN(p.getTime())) d = p;
        }
      }
      if (!d) return String(dateVal);
      var HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      var dayName = HARI[d.getDay()];
      var dd = d.getDate();
      var monthName = BULAN_INDO[d.getMonth()];
      var yyyy = d.getFullYear();
      var res = dayName + ', ' + dd + ' ' + monthName + ' ' + yyyy;
      if (withTime) {
        var hh = String(d.getHours()).padStart(2, '0');
        var mm = String(d.getMinutes()).padStart(2, '0');
        res += ' ' + hh + ':' + mm + ' WIB';
      }
      return res;
    }

    // Helper memformat hari dan tanggal dd/mm/yyyy tanpa jam (contoh: Jumat, 30/10/2026)
    function formatTanggalHariDMY(dateVal) {
      if (!dateVal || dateVal === '-') return '-';
      var HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      var d = null;
      if (dateVal instanceof Date) {
        d = isNaN(dateVal.getTime()) ? null : dateVal;
      } else {
        var s = String(dateVal).trim();
        var dmMatch = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (dmMatch) {
          d = new Date(parseInt(dmMatch[3], 10), parseInt(dmMatch[2], 10) - 1, parseInt(dmMatch[1], 10));
        } else {
          var cleanStr = s.replace(/\s*\(Waktu Indonesia [^\)]+\)/i, '').trim();
          var p = new Date(cleanStr);
          if (!isNaN(p.getTime())) {
            d = p;
          } else {
            var p2 = new Date(s);
            if (!isNaN(p2.getTime())) d = p2;
          }
        }
      }
      if (!d || isNaN(d.getTime())) return String(dateVal);
      var dayName = HARI[d.getDay()];
      var dd = String(d.getDate()).padStart(2, '0');
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var yyyy = d.getFullYear();
      return dayName + ', ' + dd + '/' + mm + '/' + yyyy;
    }

    // Helper formatting dd/mm/yyyy
    function formatDateDMY(dateVal) {
      if (!dateVal || dateVal === '-') return '-';
      if (dateVal instanceof Date) {
        var dd = String(dateVal.getDate()).padStart(2, '0');
        var mm = String(dateVal.getMonth() + 1).padStart(2, '0');
        var yyyy = dateVal.getFullYear();
        return dd + '/' + mm + '/' + yyyy;
      }
      var s = String(dateVal).trim();
      var datePart = s.split(' ')[0].split('T')[0];
      if (datePart.indexOf('-') !== -1) {
        var p = datePart.split('-');
        if (p.length === 3) {
          if (p[0].length === 4) {
            return p[2].padStart(2, '0') + '/' + p[1].padStart(2, '0') + '/' + p[0];
          } else {
            return p[0].padStart(2, '0') + '/' + p[1].padStart(2, '0') + '/' + p[2];
          }
        }
      } else if (datePart.indexOf('/') !== -1) {
        var p = datePart.split('/');
        if (p.length === 3) {
          if (p[0].length === 4) {
            return p[2].padStart(2, '0') + '/' + p[1].padStart(2, '0') + '/' + p[0];
          } else {
            return p[0].padStart(2, '0') + '/' + p[1].padStart(2, '0') + '/' + p[2];
          }
        }
      }
      return datePart;
    }

    // Helper memformat jam menjadi HH:mm (contoh: 21:00)
    function formatJamHHMM(val) {
      if (!val && val !== 0) return '';
      if (val instanceof Date) {
        var hh = String(val.getHours()).padStart(2, '0');
        var mm = String(val.getMinutes()).padStart(2, '0');
        return hh + ':' + mm;
      }
      var s = String(val).trim();
      var m = s.match(/(?:^|\s|T)(\d{1,2}):(\d{2})(?::\d{2})?/);
      if (m) {
        return m[1].padStart(2, '0') + ':' + m[2];
      }
      return s;
    }

    // Helper memformat rentang jam lembur normal (contoh: 21:00 wib - 23:00 wib)
    function formatRentangJamLembur(startVal, endVal) {
      var s = formatJamHHMM(startVal);
      var e = formatJamHHMM(endVal);
      if (s && e) {
        return s + ' wib - ' + e + ' wib';
      } else if (s) {
        return s + ' wib';
      }
      return '-';
    }

    // --- RIWAYAT SPL SAYA ---

    window.loadRiwayatSPL = function (isBackground) {
      if (!isBackground) {
        var tbody = document.getElementById('tableBodyRiwayatSPL');
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data SPL...</td></tr>';
        }
      }

      gasRun('getPengajuanSPLList', Auth.getToken()).then(function (res) {
        if (handleSessionExpired(res)) return;
        if (res && res.success) {
          dbSPLList = res.list || [];
          updateSPLApprovalBadge(res.pendingCount || 0);
          renderRiwayatSPLTable();
        } else if (!isBackground) {
          var tbody = document.getElementById('tableBodyRiwayatSPL');
          if (tbody) tbody.innerHTML = '<tr><td colspan="11" class="text-center text-danger py-4">' + escapeHTML(res.message || 'Gagal memuat data') + '</td></tr>';
        }
      }).catch(function (err) {
        if (!isBackground) {
          var tbody = document.getElementById('tableBodyRiwayatSPL');
          if (tbody) tbody.innerHTML = '<tr><td colspan="11" class="text-center text-danger py-4">Error: ' + escapeHTML(err.toString()) + '</td></tr>';
        }
      });
    };

    function updateSPLApprovalBadge(count) {
      var badgeNav = document.getElementById('badgeNavSPLApproval');
      if (badgeNav) {
        if (count > 0) {
          badgeNav.innerText = count;
          badgeNav.classList.remove('d-none');
        } else {
          badgeNav.classList.add('d-none');
        }
      }
    }

    function getSPLStatusBadgeHtml(status) {
      var s = String(status || '').trim();
      if (s === 'Menunggu Persetujuan Atasan') {
        return '<span class="badge badge-spl-atasan px-2.5 py-1.5 extra-small rounded-pill"><i class="bi bi-clock-history me-1"></i>Menunggu Atasan</span>';
      } else if (s === 'Menunggu Persetujuan HRD') {
        return '<span class="badge badge-spl-hrd px-2.5 py-1.5 extra-small rounded-pill"><i class="bi bi-hourglass-split me-1"></i>Menunggu HRD</span>';
      } else if (s === 'Disetujui') {
        return '<span class="badge badge-spl-approved px-2.5 py-1.5 extra-small rounded-pill"><i class="bi bi-check-circle-fill me-1"></i>Disetujui Penuh</span>';
      } else if (s === 'Ditolak') {
        return '<span class="badge badge-spl-rejected px-2.5 py-1.5 extra-small rounded-pill"><i class="bi bi-x-circle-fill me-1"></i>Ditolak</span>';
      } else if (s === 'Dibatalkan') {
        return '<span class="badge badge-spl-cancelled px-2.5 py-1.5 extra-small rounded-pill"><i class="bi bi-slash-circle me-1"></i>Dibatalkan</span>';
      }
      return '<span class="badge bg-secondary px-2.5 py-1.5 extra-small rounded-pill">' + escapeHTML(s) + '</span>';
    }

    window.handleFilterSPLChange = function () {
      currentPageRiwayatSPL = 1;
      renderRiwayatSPLTable();
    };

    window.resetFilterSPL = function () {
      var sLoc = document.getElementById('searchSPLLokasi');
      var sShift = document.getElementById('filterSPLShift');
      var sTgl = document.getElementById('filterSPLTanggal');
      if (sLoc) sLoc.value = '';
      if (sShift) sShift.value = 'SEMUA';
      if (sTgl) sTgl.value = '';
      currentPageRiwayatSPL = 1;
      renderRiwayatSPLTable();
    };

    window.setRiwayatSPLPage = function (pageNum) {
      currentPageRiwayatSPL = pageNum;
      renderRiwayatSPLTable();
    };

    function renderPaginationRiwayatSPL(totalItems, currentPage) {
      var container = document.getElementById('paginationRiwayatSPL');
      if (!container) return;

      var totalPages = Math.ceil(totalItems / pageSizeRiwayatSPL) || 1;
      if (totalItems === 0) {
        container.innerHTML = '';
        return;
      }

      var startItem = (currentPage - 1) * pageSizeRiwayatSPL + 1;
      var endItem = Math.min(currentPage * pageSizeRiwayatSPL, totalItems);

      var html = '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 p-3 border-top bg-white">' +
        '<div class="extra-small text-muted fw-semibold">' +
        'Menampilkan ' + startItem + ' - ' + endItem + ' dari ' + totalItems + ' data SPL' +
        '</div>' +
        '<nav><ul class="pagination pagination-sm m-0">';

      if (currentPage === 1) {
        html += '<li class="page-item disabled"><span class="page-link"><i class="bi bi-chevron-left"></i></span></li>';
      } else {
        html += '<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="setRiwayatSPLPage(' + (currentPage - 1) + ')"><i class="bi bi-chevron-left"></i></a></li>';
      }

      for (var p = 1; p <= totalPages; p++) {
        if (p === currentPage) {
          html += '<li class="page-item active"><span class="page-link">' + p + '</span></li>';
        } else if (p === 1 || p === totalPages || (p >= currentPage - 1 && p <= currentPage + 1)) {
          html += '<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="setRiwayatSPLPage(' + p + ')">' + p + '</a></li>';
        } else if (p === 2 || p === totalPages - 1) {
          html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
        }
      }

      if (currentPage === totalPages || totalPages === 0) {
        html += '<li class="page-item disabled"><span class="page-link"><i class="bi bi-chevron-right"></i></span></li>';
      } else {
        html += '<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="setRiwayatSPLPage(' + (currentPage + 1) + ')"><i class="bi bi-chevron-right"></i></a></li>';
      }

      html += '</ul></nav></div>';
      container.innerHTML = html;
    }

    function renderRiwayatSPLTable() {
      var tbody = document.getElementById('tableBodyRiwayatSPL');
      if (!tbody) return;

      var user = Auth.getUser();
      var currentUsername = String(user.username || '').toLowerCase();

      // Di riwayat saya, tampilkan yang diajukan oleh user login
      var mySPL = dbSPLList.filter(function (item) {
        return String(item.empId || '').toLowerCase() === currentUsername;
      });

      if (mySPL.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-5">' +
          '<div class="mb-2"><i class="bi bi-inbox fs-2 text-secondary"></i></div>' +
          '<div class="fw-semibold">Belum ada pengajuan SPL</div>' +
          '<small class="text-muted">Klik tombol "+ Buat Pengajuan SPL" untuk mengajukan lembur baru.</small>' +
          '</td></tr>';
        renderPaginationRiwayatSPL(0, 1);
        return;
      }

      var keywordLokasi = (document.getElementById('searchSPLLokasi') ? document.getElementById('searchSPLLokasi').value : '').toLowerCase().trim();
      var filterShift = document.getElementById('filterSPLShift') ? document.getElementById('filterSPLShift').value : 'SEMUA';
      var filterTgl = document.getElementById('filterSPLTanggal') ? document.getElementById('filterSPLTanggal').value : '';

      var filtered = mySPL.filter(function (item) {
        var matchLokasi = true;
        if (keywordLokasi) {
          var itemLokasi = String(item.lokasiKerja || '').toLowerCase();
          matchLokasi = (itemLokasi.indexOf(keywordLokasi) !== -1);
        }

        var matchShift = true;
        if (filterShift && filterShift !== 'SEMUA') {
          matchShift = (String(item.shift || '').toLowerCase() === filterShift.toLowerCase());
        }

        var matchTgl = true;
        if (filterTgl) {
          var itemTglStr = String(item.tanggalLembur || '').split('T')[0].split(' ')[0];
          var filterTglDMY = formatDateDMY(filterTgl);
          var itemTglDMY = formatDateDMY(item.tanggalLembur);
          matchTgl = (itemTglStr === filterTgl || itemTglDMY === filterTglDMY || itemTglDMY === filterTgl);
        }

        return matchLokasi && matchShift && matchTgl;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-5">' +
          '<div class="mb-2"><i class="bi bi-funnel fs-2 text-secondary"></i></div>' +
          '<div class="fw-semibold">Tidak ada data yang sesuai filter</div>' +
          '<small class="text-muted">Coba ubah kata kunci lokasi, pilihan shift, atau tanggal.</small><br>' +
          '<button type="button" class="btn btn-sm btn-outline-primary mt-2" onclick="resetFilterSPL()"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset Filter</button>' +
          '</td></tr>';
        renderPaginationRiwayatSPL(0, 1);
        return;
      }

      var totalItems = filtered.length;
      var totalPages = Math.ceil(totalItems / pageSizeRiwayatSPL) || 1;
      if (currentPageRiwayatSPL > totalPages) currentPageRiwayatSPL = totalPages;
      if (currentPageRiwayatSPL < 1) currentPageRiwayatSPL = 1;

      var startIdx = (currentPageRiwayatSPL - 1) * pageSizeRiwayatSPL;
      var pageData = filtered.slice(startIdx, startIdx + pageSizeRiwayatSPL);

      var html = '';
      pageData.forEach(function (item, idx) {
        var rowNum = startIdx + idx + 1;
        var statusBadge = getSPLStatusBadgeHtml(item.status);
        var isApproved = (item.status === 'Disetujui');
        var tglBuatFormatted = formatDateDMY(item.tanggalPengajuan);
        var tglSPLFormatted = formatDateDMY(item.tanggalLembur);
        var jamLemburNormal = formatRentangJamLembur(item.jamMulai, item.jamSelesai);
        var cleanLokasi = (item.lokasiKerja && item.lokasiKerja !== 'Jobsite TRIOP' && item.lokasiKerja !== 'TRIOP') ? item.lokasiKerja : '-';

        var aksiButtons =

    window.calcTotalJamLemburEdit = function () {
      var jamMulaiEl = document.getElementById('splEditJamMulai');
      var jamSelesaiEl = document.getElementById('splEditJamSelesai');
      var labelEl = document.getElementById('splEditTotalJamDisplay');
      var hiddenValEl = document.getElementById('splEditTotalJamVal');

      if (!jamMulaiEl || !jamSelesaiEl) return;

      var startVal = jamMulaiEl.value;
      var endVal = jamSelesaiEl.value;

      if (!startVal || !endVal) {
        if (labelEl) labelEl.value = '0 Jam';
        if (hiddenValEl) hiddenValEl.value = '0';
        return;
      }

      var startParts = startVal.split(':');
      var endParts = endVal.split(':');

      var startMin = parseInt(startParts[0], 10) * 60 + parseInt(startParts[1], 10);
      var endMin = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10);

      var diffMin = 0;
      if (endMin >= startMin) {
        diffMin = endMin - startMin;
      } else {
        diffMin = (24 * 60 - startMin) + endMin;
      }

      var totalHoursDec = (diffMin / 60);
      var roundedDec = Math.round(totalHoursDec * 100) / 100;

      if (labelEl) labelEl.value = roundedDec + ' Jam';
      if (hiddenValEl) hiddenValEl.value = roundedDec;
    };

    window.submitFormEditSPL = function (event) {
      if (event) event.preventDefault();

      var splId = document.getElementById('splEditId').value;
      var tgl = document.getElementById('splEditTanggalLembur').value;
      var shift = document.getElementById('splEditShift').value;
      var jamMulai = document.getElementById('splEditJamMulai').value;
      var jamSelesai = document.getElementById('splEditJamSelesai').value;
      var totalJam = parseFloat(document.getElementById('splEditTotalJamVal').value || '0');
      var uraian = (document.getElementById('splEditUraianPekerjaan').value || '').trim();
      var lokasi = (document.getElementById('splEditLokasiKerja').value || '').trim();

      if (!splId) return;
      if (!tgl) {
        Swal.fire('Perhatian', 'Tanggal pelaksanaan lembur wajib diisi.', 'warning');
        return;
      }
      if (!jamMulai || !jamSelesai) {
        Swal.fire('Perhatian', 'Jam mulai dan selesai lembur wajib diisi.', 'warning');
        return;
      }
      if (totalJam <= 0) {
        Swal.fire('Perhatian', 'Total durasi lembur harus lebih besar dari 0 jam.', 'warning');
        return;
      }
      if (!uraian) {
        Swal.fire('Perhatian', 'Uraian tugas pekerjaan lembur wajib diisi.', 'warning');
        return;
      }

      var payload = {
        id: splId,
        tanggalLembur: tgl,
        shift: shift,
        jamMulai: jamMulai,
        jamSelesai: jamSelesai,
        totalJam: totalJam,
        uraianPekerjaan: uraian,
        lokasiKerja: lokasi
      };

      var btnSubmit = document.getElementById('btnSubmitEditSPL');
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Menyimpan...';
      }

      showFullPageLoading('Menyimpan perubahan SPL...');

      gasRun('updatePengajuanSPL', Auth.getToken(), payload).then(function (res) {
        hideFullPageLoading();
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = 'Simpan Perubahan';
        }
        if (handleSessionExpired(res)) return;

        if (res && res.success) {
          var modalEl = document.getElementById('modalEditSPL');
          if (modalEl) {
            var modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
          }
          Swal.fire('Berhasil', res.message || 'Perubahan data SPL berhasil disimpan.', 'success');
          loadRiwayatSPL();
        } else {
          Swal.fire('Gagal Menyimpan', (res && res.message) || 'Terjadi kesalahan sistem.', 'error');
        }
      }).catch(function (err) {
        hideFullPageLoading();
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = 'Simpan Perubahan';
        }
        Swal.fire('Error', err.toString(), 'error');
      });
    };

      var filtered = dbSPLList.filter(function (item) {

          if (isAdminOrHRD) {

          } else {
            return item.status === 'Menunggu Persetujuan Atasan' && String(item.empId).toLowerCase() !== currentUsername;

          return item.status === 'Disetujui';

    function submitApprovalSPLAction(splId, action) {
      var catatan = (document.getElementById('appModalCatatan').value || '').trim();

      if (action === 'Tolak' && !catatan) {
        Swal.fire('Catatan Diperlukan', 'Harap isi alasan penolakan pada kolom catatan.', 'warning');
        return;
      }

      var confirmTitle = action === 'Setujui' ? 'Konfirmasi Persetujuan SPL' : 'Konfirmasi Penolakan SPL';
      var confirmText = action === 'Setujui' ?
        'Apakah Anda yakin menyetujui Surat Perintah Lembur ' + splId + '?' :
        'Apakah Anda yakin menolak Surat Perintah Lembur ' + splId + '?';

      Swal.fire({
        title: confirmTitle,
        text: confirmText,
        icon: action === 'Setujui' ? 'question' : 'warning',
        showCancelButton: true,
        confirmButtonText: action === 'Setujui' ? 'Ya, Setujui' : 'Ya, Tolak',
        cancelButtonText: 'Batal',
        confirmButtonColor: action === 'Setujui' ? '#16a34a' : '#dc2626'
      }).then(function (result) {
        if (!result.isConfirmed) return;

        if (bsModalApprovalSPL) bsModalApprovalSPL.hide();
        showFullPageLoading('Memproses persetujuan SPL...');

        gasRun('processApprovalSPL', Auth.getToken(), splId, action, catatan).then(function (res) {
          hideFullPageLoading();
          if (handleSessionExpired(res)) return;
          if (res && res.success) {
            Swal.fire({
              icon: 'success',
              title: 'Berhasil!',
              text: res.message,
              confirmButtonColor: '#2563eb'
            });
            loadPersetujuanSPL();
            loadRiwayatSPL(true);
          } else {
            Swal.fire('Gagal', (res && res.message) || 'Terjadi kesalahan sistem.', 'error');
          }
        }).catch(function (err) {
          hideFullPageLoading();
          Swal.fire('Error', err.toString(), 'error');
        });
      });
    }

    window.printSuratSPLDoc = function () {
      var contentEl = document.getElementById('suratSPLPaperContent');
      if (!contentEl || !contentEl.innerHTML.trim()) {
        Swal.fire('Error', 'Dokumen SPL belum siap dicetak atau diekspor.', 'error');
        return;
      }
      var contentHtml = contentEl.innerHTML;

      var iframe = document.getElementById('printIframeSPL');
      if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'printIframeSPL';
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = '0';
        document.body.appendChild(iframe);
      }

      var doc = iframe.contentWindow.document;
      var cssContent =
        '@page { size: A4 portrait; margin: 10mm; }' +
        'body { font-family: "Times New Roman", Times, serif; color: #0f172a; margin: 0; padding: 10mm 12mm; background: #fff; }' +
        '.surat-spl-kop { border-bottom: 3px double #0f172a; padding-bottom: 8px; margin-bottom: 16px; }' +
        '.surat-spl-kop-logo { max-width: 80px; max-height: 80px; object-fit: contain; }' +
        '.surat-spl-kop-company { font-size: 15pt; font-weight: 900; letter-spacing: 0.8px; color: #0f172a; line-height: 1.2; }' +
        '.surat-spl-kop-division { font-size: 9pt; font-weight: 700; color: #1e293b; letter-spacing: 0.5px; }' +
        '.surat-spl-kop-address { font-size: 8pt; color: #475569; line-height: 1.35; }' +
        '.surat-spl-title { text-align: center; margin-bottom: 16px; }' +
        '.surat-spl-title h4 { font-size: 13pt; font-weight: 800; text-decoration: underline; color: #0f172a; margin-bottom: 2px; }' +
        '.surat-spl-nomor { font-size: 9pt; color: #334155; font-weight: 600; }' +
        '.surat-spl-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 9.5pt; }' +
        '.surat-spl-table td { padding: 3.5px 5px; vertical-align: top; }' +
        '.surat-spl-table .lbl { width: 28%; color: #334155; font-weight: 600; }' +
        '.surat-spl-table .colon { width: 3%; text-align: center; font-weight: bold; }' +
        '.surat-spl-table .val { width: 69%; color: #0f172a; font-weight: 600; }' +
        '.surat-spl-section-header { font-size: 9.5pt; font-weight: 700; color: #0f172a; border-left: 3px solid #2563eb; padding-left: 6px; margin: 10px 0 6px 0; background: #f8fafc; padding-top: 2px; padding-bottom: 2px; }' +
        '.surat-spl-signatures { display: flex !important; justify-content: space-between !important; margin-top: 20px; gap: 10px; }' +
        '.surat-spl-sig-box { flex: 1 !important; text-align: center; border: 1px dashed #cbd5e1; border-radius: 6px; padding: 8px 4px; background: #fafafa; }' +
        '.surat-spl-sig-title { font-size: 8pt; font-weight: 700; color: #334155; text-transform: uppercase; margin-bottom: 2px; }' +
        '.surat-spl-stamp { height: 55px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 2px 0; }' +
        '.stamp-spl-badge { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; padding: 3px 6px; border-radius: 4px; font-size: 6.5pt; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }' +

      doc.open();

      doc.close();

      var triggered = false;
      var triggerPrint = function () {
        if (triggered) return;
        triggered = true;
        try {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
        } catch (e) {
          window.print();
        }
      };

      var imgs = doc.images || [];
      if (imgs.length > 0) {
        var loaded = 0;
        var total = imgs.length;
        var checkFinish = function () {
          loaded++;
          if (loaded >= total) setTimeout(triggerPrint, 150);
        };
        for (var i = 0; i < total; i++) {
          if (imgs[i].complete) {
            checkFinish();
          } else {
            imgs[i].onload = checkFinish;
            imgs[i].onerror = checkFinish;
          }
        }
        setTimeout(triggerPrint, 500);
      } else {
        setTimeout(triggerPrint, 200);
      }
    };

      window.printSuratSPLDoc();
